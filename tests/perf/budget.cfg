; The CI wall-clock budget of the perf arena (plan P49b, ADR 0012 section 4): a regression ratchet,
; not a device ceiling. It judges the native tick, TickJob.run() with the C++ kernels attached (the
; `PERF sim impl=native` line: the best of three seed-42 runs, in ms per tick), in
; tests/perf/test_sim_perf.gd. The GDScript line is report only. The numbers live only in this file.
;
; mean_ms and p95_ms are 1.5 x the worst min-of-3 of 11 calibration runs on the CI runner (the
; ubuntu runner, sim of main at 6cae39b with P49a and P46b): the worst mean was 0.305 ms and the
; worst p95 0.565 ms, so 0.4575 and 0.8475. The best runs read 0.150 and 0.274 ms. At the budget the
; phone estimate is 5.08 ms mean and 10.25 ms p95 (ci_ratio_native_mean 11.1, ci_ratio_native_p95
; 12.1, re-derived from the first release perf-arena card, gate issue #157), under the gate's
; 13.3 ms; the estimate is printed and never asserted.
;
; A sim PR never raises these numbers (plan exception 3). A rise that a new tick phase causes
; (Phase 3's production and economy) is a qa-engineer PR with before and after calibration numbers
; and its reason, which the lead reviews. ticks and units are the workload that the numbers are
; calibrated on: a run of another size is refused, not compared.

[sim]
mean_ms=0.4575
p95_ms=0.8475
ticks=900
units=150


; The base arena (plan P93b, ADR 0021 section 1): data/scenarios/perf_bases.tres, seed 42, 900 ticks,
