; three runs of the `PERF bases impl=native` line, in tests/perf/test_base_arena_perf.gd. The same
; ratchet rules as [sim] hold, and the same recipe: 1.5 x the worst native min-of-3 of CI's runs.
; The calibration is the verify job (x86_64) of 15 successful ci.yml runs on main, 2026-11-04 to
; 2026-11-05 (d11e3b9 to 1c5cdea), all on the same base arena (final hash abe31870f7679f5c, 178
; rows). The plan names 11 runs; 15 is deliberate: they are every successful run in that range, so
; the worst values are in the set (the latest 11 give the same limits, 0.402 and 0.618 worst):
