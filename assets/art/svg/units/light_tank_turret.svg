<!-- Light tank, turret layer: faces east, pivot at the canvas centre, drawn last; shaded symmetrically because it rotates. -->
<!-- Silhouette: a low turret with a rounded rear and a chamfered front, one long barrel ending in a boxy vented muzzle block, hatch off the gun line. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- barrel -->
  <rect x="100" y="59" width="16" height="10" fill="#7D8893" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <line x1="102" y1="64" x2="112" y2="64" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round"/>
  <!-- muzzle block: 9 px face, one 2 px vent slot with metal on both sides -->
  <rect x="114" y="57" width="12" height="14" fill="#5B6670" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <line x1="120" y1="61" x2="120" y2="67" stroke="#1C2127" stroke-width="2"/>
  <!-- turret body: a raised plane, so mid olive -->
  <path d="M38 54 Q38 45 47 45 L80 45 L94 55 L94 73 L80 83 L47 83 Q38 83 38 74 Z" fill="#6B7A4F" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <!-- top plate -->
  <path d="M43 55 Q43 50 48 50 L79 50 L89 57 L89 71 L79 78 L48 78 Q43 78 43 73 Z" fill="#6B7A4F" stroke="#1C2127" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="49" y1="52.5" x2="77" y2="52.5" stroke="#8C9A6B" stroke-width="2" stroke-linecap="round"/>
  <line x1="49" y1="75.5" x2="77" y2="75.5" stroke="#8C9A6B" stroke-width="2" stroke-linecap="round"/>
  <!-- gun mantlet -->
  <rect x="89" y="55" width="11" height="18" rx="2" fill="#5B6670" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <!-- commander hatch (upper side) and sight block (lower side) -->
  <circle cx="52" cy="58" r="6.5" fill="#7D8893" stroke="#1C2127" stroke-width="1.5"/>
  <circle cx="52" cy="58" r="2.8" fill="#1C2127"/>
  <rect x="71" y="69" width="10" height="6" rx="1.5" fill="#5B6670" stroke="#1C2127" stroke-width="1.5"/>
  <!-- turret ring marker at the pivot -->
  <circle cx="64" cy="64" r="2" fill="#1C2127"/>
</svg>
