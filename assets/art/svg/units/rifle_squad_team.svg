<!-- Rifle squad, team layer: white and grey only, tinted at run time, drawn on top of the hull. -->
<!-- Shape: one round helmet cover per soldier, a white dome on a grey rim so the tint gets a shaded lower right edge. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <g transform="translate(39 32)">
    <circle cx="0.5" cy="-0.5" r="4.4" fill="#BFBFBF" stroke="#4D4D4D" stroke-width="1.5"/>
    <circle cx="-0.4" cy="-1.4" r="2.8" fill="#FFFFFF"/>
  </g>
  <g transform="translate(26 15.5)">
    <circle cx="0.5" cy="-0.5" r="4.4" fill="#BFBFBF" stroke="#4D4D4D" stroke-width="1.5"/>
    <circle cx="-0.4" cy="-1.4" r="2.8" fill="#FFFFFF"/>
  </g>
  <g transform="translate(26 48.5)">
    <circle cx="0.5" cy="-0.5" r="4.4" fill="#BFBFBF" stroke="#4D4D4D" stroke-width="1.5"/>
    <circle cx="-0.4" cy="-1.4" r="2.8" fill="#FFFFFF"/>
  </g>
  <g transform="translate(12 32)">
    <circle cx="0.5" cy="-0.5" r="4.4" fill="#BFBFBF" stroke="#4D4D4D" stroke-width="1.5"/>
    <circle cx="-0.4" cy="-1.4" r="2.8" fill="#FFFFFF"/>
  </g>
</svg>
