<!-- Heavy tank, turret layer: faces east, pivot at the canvas centre, drawn last; shaded symmetrically because it rotates. -->
<!-- Silhouette: a wide eight-sided turret with a boxy rear bustle, one thick barrel with a fat fume bulge and a cross-bar muzzle brake at its end, hatch off the gun line. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- barrel -->
  <rect x="92" y="58" width="30" height="12" fill="#7D8893" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <line x1="96" y1="64" x2="120" y2="64" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round"/>
  <!-- fume bulge -->
  <rect x="100" y="53" width="11" height="22" rx="3" fill="#A9B4BE" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <!-- cross-bar muzzle brake, one 2 px slot with metal on both sides -->
  <rect x="116" y="52" width="10" height="24" rx="2" fill="#5B6670" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <line x1="121" y1="56" x2="121" y2="72" stroke="#1C2127" stroke-width="2"/>
  <!-- rear bustle -->
  <rect x="18" y="52" width="14" height="24" rx="4" fill="#4E5A3A" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <line x1="21.5" y1="57" x2="21.5" y2="71" stroke="#8C9A6B" stroke-width="2" stroke-linecap="round"/>
  <!-- turret body: a raised plane, so mid olive -->
  <polygon points="28,52 38,40 74,40 88,50 88,78 74,88 38,88 28,76" fill="#6B7A4F" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <!-- top plate -->
  <polygon points="34,55 42,46 72,46 82,54 82,74 72,82 42,82 34,73" fill="#6B7A4F" stroke="#1C2127" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="44" y1="48.5" x2="71" y2="48.5" stroke="#8C9A6B" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="79.5" x2="71" y2="79.5" stroke="#8C9A6B" stroke-width="2" stroke-linecap="round"/>
  <!-- gun mantlet -->
  <rect x="86" y="48" width="10" height="32" rx="3" fill="#5B6670" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <!-- commander hatch, upper side only -->
  <circle cx="47" cy="55" r="6" fill="#7D8893" stroke="#1C2127" stroke-width="1.5"/>
  <circle cx="47" cy="55" r="2.5" fill="#1C2127"/>
  <!-- turret ring marker at the pivot -->
  <circle cx="64" cy="64" r="2" fill="#1C2127"/>
</svg>
