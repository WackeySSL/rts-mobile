<!-- Heavy tank, team layer: white and grey only, tinted at run time, drawn between hull and turret. -->
<!-- Shape: a long plate on top of each track pod, a pair of wedges on the nose and a short strip on each rear corner of the deck, all clear of the turret ring. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <g stroke="#4D4D4D" stroke-width="1.5" stroke-linejoin="round">
    <!-- track plates: mirrored about the long axis, set in from the pod edge so the pod highlight stays visible -->
    <rect x="14" y="20.5" width="78" height="16" rx="3" fill="#FFFFFF"/>
    <rect x="14" y="91.5" width="78" height="16" rx="3" fill="#FFFFFF"/>
    <!-- nose wedges, on the lit and shaded facets -->
    <polygon points="91,46 105,54 105,62 91,61" fill="#FFFFFF"/>
    <polygon points="91,82 105,74 105,66 91,67" fill="#FFFFFF"/>
    <!-- rear deck strips -->
    <rect x="17" y="45" width="12" height="5" rx="2" fill="#FFFFFF"/>
    <rect x="17" y="78" width="12" height="5" rx="2" fill="#FFFFFF"/>
  </g>
  <!-- grey shade on the lower edge of each plate -->
  <g fill="#BFBFBF">
    <rect x="15" y="33.5" width="76" height="2.5" rx="1"/>
    <rect x="15" y="104.5" width="76" height="2.5" rx="1"/>
  </g>
</svg>
