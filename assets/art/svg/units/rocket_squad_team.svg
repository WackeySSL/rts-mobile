<!-- Rocket squad, team layer: white and grey only, tinted at run time, drawn on top of the hull. -->
<!-- Shape: one round helmet cover per soldier, like the rifle squad, plus a broad band round the middle of each tube. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <g transform="translate(26.5 18.5)">
    <circle cx="0.5" cy="-1.5" r="4.4" fill="#BFBFBF" stroke="#4D4D4D" stroke-width="1.5"/>
    <circle cx="-0.2" cy="-2.2" r="2.6" fill="#FFFFFF"/>
    <rect x="5" y="2.5" width="7" height="5" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(22.5 45.5)">
    <circle cx="0.5" cy="-1.5" r="4.4" fill="#BFBFBF" stroke="#4D4D4D" stroke-width="1.5"/>
    <circle cx="-0.2" cy="-2.2" r="2.6" fill="#FFFFFF"/>
    <rect x="5" y="2.5" width="7" height="5" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
