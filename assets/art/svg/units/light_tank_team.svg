<!-- Light tank, team layer: white and grey only, tinted at run time, drawn between hull and turret. -->
<!-- Shape: a broad band across the rear deck and a long plate on top of each track pod, all clear of the turret ring. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <g stroke="#4D4D4D" stroke-width="1.5" stroke-linejoin="round">
    <!-- rear band -->
    <rect x="23" y="49" width="13" height="30" rx="2" fill="#FFFFFF"/>
    <!-- track plates: mirrored about the long axis, set 2 px in from the pod edge so the pod highlight stays visible -->
    <rect x="20" y="28.5" width="82" height="10" rx="3" fill="#FFFFFF"/>
    <rect x="20" y="89.5" width="82" height="10" rx="3" fill="#FFFFFF"/>
  </g>
  <!-- grey shade on the lower or rear edge of each plate -->
  <g fill="#BFBFBF">
    <rect x="32.5" y="50" width="3" height="28"/>
    <rect x="21" y="35" width="80" height="3" rx="1.5"/>
    <rect x="21" y="96" width="80" height="3" rx="1.5"/>
  </g>
</svg>
