<!-- Selection ring: one shared sprite for every own selected unit, scaled by the view to the unit's radius. -->
<!-- Shape: a plain closed circle, a white band on a dark outline, no fill. Centre line radius 72 px: band 12 px (r/6), outline 4 px each side (r/18), so the ratios match 3 dp + 1 dp + 1 dp at the 18 dp minimum radius. -->
<svg xmlns="http://www.w3.org/2000/svg" width="168" height="168" viewBox="0 0 168 168">
  <circle cx="84" cy="84" r="72" fill="none" stroke="#1C2127" stroke-width="20"/>
  <circle cx="84" cy="84" r="72" fill="none" stroke="#FFFFFF" stroke-width="12"/>
</svg>
