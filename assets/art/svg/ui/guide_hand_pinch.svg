<!-- Guide hand, pinching: white and grey only, tinted at run time (the tutorial's gesture hint for a zoom; the two fingertips are the two touch points, about 51 px apart at x 62 y 100 for the index finger and x 79 y 149 for the thumb). -->
<!-- Shape: a hand seen from the side, a tall blocky fist on the right, an index finger reaching left from its top and a thumb reaching left and up from its foot, both tilted toward each other, the two tips facing each other across a small gap like an open C. -->
<svg xmlns="http://www.w3.org/2000/svg" width="216" height="216" viewBox="0 0 216 216">
  <!-- edge -->
  <g fill="#4D4D4D" stroke="#4D4D4D" stroke-width="10" stroke-linejoin="round">
    <rect x="112" y="56" width="84" height="144" rx="30"/>
    <rect x="52" y="70" width="86" height="30" rx="15" transform="rotate(-12 130 85)"/>
    <rect x="58" y="152" width="80" height="32" rx="16" transform="rotate(24 130 168)"/>
  </g>
  <!-- bodies -->
  <g fill="#FFFFFF">
    <rect x="112" y="56" width="84" height="144" rx="30"/>
    <rect x="52" y="70" width="86" height="30" rx="15" transform="rotate(-12 130 85)"/>
    <rect x="58" y="152" width="80" height="32" rx="16" transform="rotate(24 130 168)"/>
  </g>
  <!-- shade: the fist's lower right and the underside of the index finger -->
  <path d="M196 150 V170 Q196 200 166 200 H122 Q184 192 188 150 Z" fill="#BFBFBF"/>
  <rect x="64" y="90" width="64" height="7" rx="3" fill="#BFBFBF" transform="rotate(-12 130 85)"/>
</svg>
