    <radialGradient id="puffW"><stop offset="0" stop-color="#ffe6c0" stop-opacity="0.95"/><stop offset="0.6" stop-color="#f0c48e" stop-opacity="0.8"/><stop offset="1" stop-color="#e0a468" stop-opacity="0"/></radialGradient>
    <radialGradient id="puffC"><stop offset="0" stop-color="#e6f8fa" stop-opacity="0.95"/><stop offset="0.6" stop-color="#b6dde4" stop-opacity="0.8"/><stop offset="1" stop-color="#86bcc8" stop-opacity="0"/></radialGradient>
