<!-- App icon, full square (512 x 512, no rounded corners and no transparent edge: the stores add their own mask): the two adaptive layers of this folder stacked, background first, and scaled by 1.7 about the centre so that the tank fills the square. Redraw icon_background.svg and icon_foreground.svg first and stack them again; the drawing is the same. -->
<!-- Silhouette: one wide, low tank with a wedge turret and a long gun pointing up and to the right at the viewer, charging out of a band of dust in front of a sky split on a steep diagonal, amber with a gas flare and a pumpjack on the left, cyan with wind turbines and solar panels on the right. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="skyWarm" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="240"><stop offset="0" stop-color="#c94d12"/><stop offset="0.5" stop-color="#e8681f"/><stop offset="1" stop-color="#ff9446"/></linearGradient>
    <linearGradient id="skyCool" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="240"><stop offset="0" stop-color="#1590b0"/><stop offset="0.5" stop-color="#1fa6c8"/><stop offset="1" stop-color="#62d6ee"/></linearGradient>
    <linearGradient id="groundWarm" gradientUnits="userSpaceOnUse" x1="0" y1="240" x2="0" y2="432"><stop offset="0" stop-color="#9a4216"/><stop offset="0.45" stop-color="#5a2a10"/><stop offset="1" stop-color="#2a150a"/></linearGradient>
