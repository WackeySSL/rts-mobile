    <linearGradient id="occlude" gradientUnits="userSpaceOnUse" x1="0" y1="236" x2="0" y2="266"><stop offset="0" stop-color="#000000" stop-opacity="0.6"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></linearGradient>
    <linearGradient id="occludeUp" gradientUnits="userSpaceOnUse" x1="0" y1="218" x2="0" y2="248"><stop offset="0" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.5"/></linearGradient>
