<!-- App icon, adaptive foreground layer (108 dp at 4x = 432 px, transparent outside the artwork): one tank rolling out at the viewer with dirt clods and sparks flung from its tracks, every painted pixel inside the 288 px safe circle. -->
<!-- Silhouette: a broad, low battle tank in three-quarter front view from a little above its deck: two toothed track bands at the bottom, a wedge-nosed hull with a sloped glacis between them, a turret on a dark ring on the hull's centre line, and a long smoothbore gun out of a broad mantlet that runs from the turret toward the viewer's right, its muzzle the nearest and largest shape, breaking out over a radar ring. -->
