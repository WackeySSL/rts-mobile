<!-- App icon, Android adaptive foreground layer (108 dp at 4x = 432 px, transparent outside the tank): one tank charging at the viewer from a low angle, every painted pixel inside the central 288 px safe circle. -->
<!-- Silhouette: a wide, low tank seen head-on from just below its deck, flanks leaning in toward the top: two dark track blocks under short fenders and a sloped hull front, a wedge turret swung to the right so its lit left side shows, and a long gun that points up and to the right at the viewer and ends in a big dark muzzle ring. -->
