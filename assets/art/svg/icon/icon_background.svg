<!-- App icon, Android adaptive background layer (108 dp at 4x = 432 px, fills the whole canvas): a sky split on a steep diagonal, warm with a gas flare and a pumpjack on the left, cool with wind turbines and a solar row on the right, and a band of dust along the bottom. The tank of icon_foreground.svg stands over its centre; only the central 288 px circle is guaranteed to show. -->
<!-- Silhouette: a steep diagonal seam from the top right to the bottom left parts an amber sky from a cyan sky; a nodding pumpjack and a lattice flare stack with a flame stand on the warm horizon, two white wind turbines and a row of tilted solar panels on the cool one, and a pale band of dust billows along the foot. -->
<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 432 432">
  <defs>
    <linearGradient id="skyWarm" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="240"><stop offset="0" stop-color="#c94d12"/><stop offset="0.5" stop-color="#e8681f"/><stop offset="1" stop-color="#ff9446"/></linearGradient>
    <linearGradient id="skyCool" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="240"><stop offset="0" stop-color="#1590b0"/><stop offset="0.5" stop-color="#1fa6c8"/><stop offset="1" stop-color="#62d6ee"/></linearGradient>
    <linearGradient id="groundWarm" gradientUnits="userSpaceOnUse" x1="0" y1="240" x2="0" y2="432"><stop offset="0" stop-color="#9a4216"/><stop offset="0.45" stop-color="#5a2a10"/><stop offset="1" stop-color="#2a150a"/></linearGradient>
    <linearGradient id="groundCool" gradientUnits="userSpaceOnUse" x1="0" y1="240" x2="0" y2="432"><stop offset="0" stop-color="#14829a"/><stop offset="0.45" stop-color="#0c5368"/><stop offset="1" stop-color="#062a37"/></linearGradient>
    <linearGradient id="seam" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="300"><stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fb8d8"/><stop offset="1" stop-color="#0f3f57"/></linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a9cdd8"/></linearGradient>
    <radialGradient id="flame" cx="0.5" cy="0.8" r="0.8"><stop offset="0" stop-color="#fff8d6"/><stop offset="0.4" stop-color="#ffd24d"/><stop offset="1" stop-color="#ff7a1a"/></radialGradient>
    <radialGradient id="flareGlow" gradientUnits="userSpaceOnUse" cx="150" cy="122" r="74"><stop offset="0" stop-color="#ffe9a8" stop-opacity="0.95"/><stop offset="0.5" stop-color="#ffc060" stop-opacity="0.45"/><stop offset="1" stop-color="#ffb060" stop-opacity="0"/></radialGradient>
    <radialGradient id="backlight" gradientUnits="userSpaceOnUse" cx="216" cy="200" r="150"><stop offset="0" stop-color="#fff4dc" stop-opacity="0.6"/><stop offset="0.55" stop-color="#fff4dc" stop-opacity="0.22"/><stop offset="1" stop-color="#fff4dc" stop-opacity="0"/></radialGradient>
    <radialGradient id="puffW"><stop offset="0" stop-color="#ffe6c0" stop-opacity="0.95"/><stop offset="0.6" stop-color="#f0c48e" stop-opacity="0.8"/><stop offset="1" stop-color="#e0a468" stop-opacity="0"/></radialGradient>
    <radialGradient id="puffC"><stop offset="0" stop-color="#e6f8fa" stop-opacity="0.95"/><stop offset="0.6" stop-color="#b6dde4" stop-opacity="0.8"/><stop offset="1" stop-color="#86bcc8" stop-opacity="0"/></radialGradient>
    <radialGradient id="smoke"><stop offset="0" stop-color="#3a1608" stop-opacity="0.35"/><stop offset="1" stop-color="#3a1608" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="216" cy="216" r="300"><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.45"/></radialGradient>
  </defs>
  <!-- Sky and ground: the warm one over the whole canvas, the cool one over its right of the seam from (300,0) to (140,432), so that no pixel along the seam is half empty. -->
  <rect width="432" height="432" fill="url(#skyWarm)"/>
  <polygon points="300,0 432,0 432,432 140,432" fill="url(#skyCool)"/>
  <circle cx="150" cy="122" r="74" fill="url(#flareGlow)"/>
  <circle cx="216" cy="200" r="150" fill="url(#backlight)"/>
  <!-- Far ridges on each side of the seam. -->
  <path d="M0 232 L30 222 L64 228 L96 216 L130 226 L170 218 L212 230 L212 242 L0 242 Z" fill="#8a360f" opacity="0.5"/>
  <path d="M212 232 L252 220 L290 226 L330 214 L372 224 L432 216 L432 242 L212 242 Z" fill="#0f6f8c" opacity="0.5"/>
  <rect x="0" y="240" width="432" height="192" fill="url(#groundWarm)"/>
  <polygon points="211,240 432,240 432,432 140,432" fill="url(#groundCool)"/>
  <!-- Warm side: smoke and a lattice flare stack with its flame, and a pumpjack facing left. -->
  <g>
    <ellipse cx="136" cy="76" rx="40" ry="22" fill="url(#smoke)"/>
    <ellipse cx="118" cy="52" rx="44" ry="20" fill="url(#smoke)"/>
    <path d="M142 244 L147 152 M158 244 L153 152 M146 224 L156 200 M154 224 L144 200 M145 190 L154 170 M155 190 L146 170" stroke="#3a1c0c" stroke-width="2.5" fill="none"/>
    <rect x="144" y="148" width="12" height="6" fill="#3a1c0c"/>
    <path d="M150 150 C138 142 134 124 142 110 C143 120 148 122 149 112 C149 100 145 96 150 84 C160 96 168 112 163 128 C161 139 157 145 150 150 Z" fill="url(#flame)"/>
    <path d="M150 148 C143 142 142 133 147 123 C148 129 152 129 153 123 C158 131 157 142 150 148 Z" fill="#fffbe6" opacity="0.9"/>
    <g fill="#ffd9a0"><circle cx="166" cy="104" r="1.8"/><circle cx="132" cy="96" r="1.5"/><circle cx="172" cy="124" r="1.5"/><circle cx="128" cy="116" r="1.8"/></g>
    <g fill="#3a1c0c">
      <rect x="72" y="238" width="68" height="6"/>
      <polygon points="96,240 110,200 124,240"/>
      <polygon points="72,190 138,208 138,216 72,200"/>
      <path d="M70 190 C70 180 82 180 88 186 L92 204 C86 210 74 208 70 200 Z"/>
      <rect x="78" y="200" width="2.5" height="38"/>
      <circle cx="134" cy="222" r="12"/>
      <rect x="126" y="228" width="26" height="12"/>
    </g>
  </g>
  <!-- Cool side: wind turbines and a row of solar panels. -->
  <g>
    <path d="M299 242 L309 242 L306 168 L302 168 Z" fill="url(#tower)" stroke="#0e5a73" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="307.4,165.4 298.4,128.4 296.4,128.8 300.6,166.6" fill="#f2f6f8" stroke="#0e5a73" stroke-width="1.5"/>
    <polygon points="301.8,163.3 274.2,189.7 275.5,191.2 306.2,168.7" fill="#f2f6f8" stroke="#0e5a73" stroke-width="1.5"/>
    <polygon points="302.8,169.3 339.4,179.9 340.1,178.1 305.2,162.7" fill="#f2f6f8" stroke="#0e5a73" stroke-width="1.5"/>
    <rect x="297" y="161" width="14" height="10" rx="3" fill="#f2f6f8" stroke="#0e5a73" stroke-width="1.5"/>
    <path d="M341 242 L347 242 L345.5 206 L342.5 206 Z" fill="url(#tower)" stroke="#0e5a73" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="344.9,206.4 369.6,195.5 369.1,194.0 343.1,201.6" fill="#f2f6f8" stroke="#0e5a73" stroke-width="1.2"/>
    <polygon points="345.7,202.0 323.8,186.0 322.8,187.3 342.3,206.0" fill="#f2f6f8" stroke="#0e5a73" stroke-width="1.2"/>
    <polygon points="341.4,203.5 338.5,230.5 340.1,230.7 346.6,204.5" fill="#f2f6f8" stroke="#0e5a73" stroke-width="1.2"/>
    <circle cx="344" cy="204" r="4" fill="#f2f6f8" stroke="#0e5a73" stroke-width="1.2"/>
    <g fill="url(#panel)" stroke="#d6f3fb" stroke-width="1.5" stroke-linejoin="round">
      <path d="M262 238 L270 214 L288 214 L282 238 Z"/>
      <path d="M286 238 L294 214 L312 214 L306 238 Z"/>
      <path d="M310 238 L318 214 L336 214 L330 238 Z"/>
      <path d="M334 238 L342 214 L360 214 L354 238 Z"/>
      <path d="M358 238 L366 214 L384 214 L378 238 Z"/>
    </g>
  </g>
  <!-- The seam: a bright diagonal edge between the two skies. -->
  <polygon points="297,0 303,0 143,432 137,432" fill="url(#seam)"/>
  <!-- Dust band along the foot, lit warm on the left of the seam and cool on the right. -->
  <g>
    <ellipse cx="34" cy="296" rx="64" ry="30" fill="url(#puffW)"/>
    <ellipse cx="108" cy="304" rx="70" ry="32" fill="url(#puffW)"/>
    <ellipse cx="176" cy="308" rx="66" ry="30" fill="url(#puffW)"/>
    <ellipse cx="256" cy="308" rx="66" ry="30" fill="url(#puffC)"/>
    <ellipse cx="326" cy="304" rx="70" ry="32" fill="url(#puffC)"/>
    <ellipse cx="400" cy="296" rx="64" ry="30" fill="url(#puffC)"/>
    <ellipse cx="64" cy="334" rx="70" ry="26" fill="url(#puffW)" opacity="0.7"/>
    <ellipse cx="150" cy="340" rx="64" ry="24" fill="url(#puffW)" opacity="0.6"/>
    <ellipse cx="282" cy="340" rx="64" ry="24" fill="url(#puffC)" opacity="0.6"/>
    <ellipse cx="368" cy="334" rx="70" ry="26" fill="url(#puffC)" opacity="0.7"/>
  </g>
  <rect width="432" height="432" fill="url(#vignette)"/>
</svg>
