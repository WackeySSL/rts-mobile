<!-- Vehicle factory, hull layer: drawn first, holds the ground shadow of the whole building. -->
<!-- Silhouette: one wide hall with a five-tooth sawtooth roof across the back, a dark doorway in its front wall and an open bay with two arrows pointing out, crates on the left and a round tank on the right. -->
<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <!-- ground shadow, offset (4,4), flattened as one group -->
  <g transform="translate(4 4)" opacity="0.25" fill="#000000">
    <rect x="6" y="6" width="372" height="372" rx="8"/>
  </g>
  <!-- pad: the lowest plane -->
  <rect x="6" y="6" width="372" height="372" rx="8" fill="#5B6670" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="11,370 11,11 370,11" fill="none" stroke="#7D8893" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- bay in front of the hall, the arrows point the way out -->
  <rect x="92" y="256" width="200" height="106" rx="6" fill="#4E5A3A" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <rect x="98" y="262" width="188" height="94" rx="3" fill="none" stroke="#F5A524" stroke-width="2" stroke-dasharray="14 8"/>
  <g fill="none" stroke="#1C2127" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="130,278 192,306 254,278"/>
    <polyline points="130,312 192,340 254,312"/>
  </g>
  <g fill="none" stroke="#F5A524" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="130,278 192,306 254,278"/>
    <polyline points="130,312 192,340 254,312"/>
  </g>
  <!-- crates on the left -->
  <g fill="#7D8893" stroke="#1C2127" stroke-width="1.5" stroke-linejoin="round">
    <rect x="28" y="264" width="44" height="34" rx="3"/>
    <rect x="28" y="306" width="44" height="34" rx="3"/>
    <rect x="48" y="346" width="32" height="20" rx="3"/>
  </g>
  <g fill="none" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round">
    <polyline points="31,295 31,267 69,267"/>
    <polyline points="31,337 31,309 69,309"/>
  </g>
  <!-- round tank on the right -->
  <circle cx="330" cy="304" r="34" fill="#7D8893" stroke="#1C2127" stroke-width="3"/>
  <circle cx="330" cy="304" r="20" fill="#5B6670" stroke="#1C2127" stroke-width="1.5"/>
  <circle cx="330" cy="304" r="8" fill="#A9B4BE" stroke="#1C2127" stroke-width="1.5"/>
  <path d="M298 304 A32 32 0 0 1 330 272" fill="none" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round"/>
  <!-- hall: walls and the five teeth of the roof -->
  <rect x="22" y="22" width="340" height="224" rx="6" fill="#5B6670" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#7D8893" stroke="#1C2127" stroke-width="1.5" stroke-linejoin="round">
    <rect x="30" y="26" width="324" height="34" rx="2"/>
    <rect x="30" y="70" width="324" height="34" rx="2"/>
    <rect x="30" y="114" width="324" height="34" rx="2"/>
    <rect x="30" y="158" width="324" height="34" rx="2"/>
    <rect x="30" y="202" width="324" height="34" rx="2"/>
  </g>
  <!-- the glazed face of each tooth, the lightest tone -->
  <g fill="#A9B4BE" stroke="#1C2127" stroke-width="1.5" stroke-linejoin="round">
    <rect x="30" y="60" width="324" height="8"/>
    <rect x="30" y="104" width="324" height="8"/>
    <rect x="30" y="148" width="324" height="8"/>
    <rect x="30" y="192" width="324" height="8"/>
  </g>
  <!-- light on the top edge of each tooth -->
  <g stroke="#A9B4BE" stroke-width="2" stroke-linecap="round">
    <line x1="34" y1="29" x2="350" y2="29"/>
    <line x1="34" y1="73" x2="350" y2="73"/>
    <line x1="34" y1="117" x2="350" y2="117"/>
    <line x1="34" y1="161" x2="350" y2="161"/>
    <line x1="34" y1="205" x2="350" y2="205"/>
  </g>
  <!-- doorway in the front wall -->
  <rect x="108" y="246" width="168" height="14" fill="#1C2127"/>
</svg>
