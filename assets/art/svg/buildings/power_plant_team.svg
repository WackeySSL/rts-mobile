<!-- Power plant, team layer: white and grey only, tinted at run time, drawn over the hull; the same 256 x 352 canvas. -->
<!-- Shape: two bands round the chimney, a ring on the rim and a band round the waist of the cooling tower, a stripe along each south eave of the hall, a pennant on the mast, a panel on the kiosk roof and a stripe on each transformer tank. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="352" viewBox="0 0 256 352">
  <defs>
    <clipPath id="stack"><path d="M43 14 L37 162 A15 15 0 0 0 67 162 L61 14 A9 9 0 0 0 43 14 Z"/></clipPath>
    <clipPath id="shell"><path d="M136 70 A40 40 0 0 1 216 70 C214 90 210 100 212 108 C214 130 222 150 230 180 A54 54 0 0 1 122 180 C130 150 138 130 140 108 C142 100 138 90 136 70 Z"/></clipPath>
  </defs>
  <!-- chimney bands: a dark arc under a white one, as the lower half of a ring seen from above -->
  <g clip-path="url(#stack)" fill="none">
    <path d="M42 36 A10 10 0 0 0 62 36 M41 56 A11 11 0 0 0 63 56" stroke="#4D4D4D" stroke-width="11"/>
    <path d="M42 36 A10 10 0 0 0 62 36 M41 56 A11 11 0 0 0 63 56" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M42 39.5 A10 10 0 0 0 62 39.5 M41 59.5 A11 11 0 0 0 63 59.5" stroke="#BFBFBF" stroke-width="1.5"/>
  </g>
  <!-- cooling tower: rim ring and a band round the waist -->
  <g fill="none">
    <circle cx="176" cy="70" r="37" stroke="#4D4D4D" stroke-width="8"/>
    <circle cx="176" cy="70" r="37" stroke="#FFFFFF" stroke-width="5"/>
  </g>
  <g clip-path="url(#shell)" fill="none">
    <path d="M138 124 A38 38 0 0 0 214 124" stroke="#4D4D4D" stroke-width="12"/>
    <path d="M138 124 A38 38 0 0 0 214 124" stroke="#FFFFFF" stroke-width="9"/>
    <path d="M138 128.5 A38 38 0 0 0 214 128.5" stroke="#BFBFBF" stroke-width="1.5"/>
  </g>
  <g fill="#FFFFFF" stroke="#4D4D4D" stroke-width="1.5" stroke-linejoin="round">
    <!-- hall: a stripe along the south eave of the roof and one under its cornice -->
    <rect x="18" y="262" width="150" height="7"/>
    <rect x="18" y="283" width="146" height="6"/>
    <!-- kiosk roof panel and the two transformer tank stripes -->
    <rect x="188" y="309" width="40" height="15" rx="2"/>
    <rect x="188" y="266" width="26" height="6"/>
    <rect x="224" y="280" width="22" height="6"/>
  </g>
  <g fill="#BFBFBF"><rect x="19" y="267" width="148" height="1.5"/><rect x="19" y="287" width="144" height="1.5"/></g>
  <!-- pennant on the mast -->
  <g stroke="#4D4D4D" stroke-width="1.5" stroke-linejoin="round">
    <path d="M80 313 C88 310 94 317 104 314 L104 328 C94 331 88 324 80 327 Z" fill="#FFFFFF"/>
    <path d="M80 320 C88 317 94 324 104 321 L104 323.5 C94 326.5 88 319.5 80 322.5 Z" fill="#BFBFBF" stroke="none"/>
  </g>
</svg>
