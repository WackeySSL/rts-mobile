<!-- Refinery, hull layer: drawn first, holds the ground shadow of the whole building. -->
<!-- Silhouette: one fat round silo and two small ones stepping off to the right behind a wide hall, a belt rising from a gold-filled funnel that juts out of the middle of the front. -->
<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <!-- ground shadow, offset (4,4), flattened as one group -->
  <g transform="translate(4 4)" opacity="0.25" fill="#000000">
    <rect x="6" y="6" width="372" height="372" rx="20"/>
  </g>
  <!-- pad: the lowest plane -->
  <rect x="6" y="6" width="372" height="372" rx="20" fill="#5B6670" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="11,358 11,26 26,11 358,11" fill="none" stroke="#7D8893" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- pipe from the big silo to the first small one -->
  <g fill="#5B6670" stroke="#1C2127" stroke-width="1.5" stroke-linejoin="round">
    <rect x="172" y="62" width="62" height="18"/>
  </g>
  <!-- hall roof -->
  <rect x="22" y="192" width="340" height="114" rx="8" fill="#7D8893" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="26,302 26,196 358,196" fill="none" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- plinths for the two team plates, darkest olive -->
  <g fill="#4E5A3A" stroke="#1C2127" stroke-width="1.5" stroke-linejoin="round">
    <rect x="30" y="200" width="136" height="98" rx="4"/>
    <rect x="218" y="200" width="88" height="98" rx="4"/>
  </g>
  <!-- vent block at the right end of the hall -->
  <rect x="312" y="200" width="42" height="98" rx="3" fill="#5B6670" stroke="#1C2127" stroke-width="1.5"/>
  <g stroke="#1C2127" stroke-width="2" stroke-linecap="round">
    <line x1="318" y1="212" x2="348" y2="212"/>
    <line x1="318" y1="226" x2="348" y2="226"/>
    <line x1="318" y1="240" x2="348" y2="240"/>
    <line x1="318" y1="254" x2="348" y2="254"/>
    <line x1="318" y1="268" x2="348" y2="268"/>
    <line x1="318" y1="282" x2="348" y2="282"/>
  </g>
  <!-- belt between the plinths, from the funnel up to an elevator head -->
  <rect x="172" y="176" width="40" height="138" fill="#5B6670" stroke="#1C2127" stroke-width="1.5"/>
  <rect x="166" y="164" width="52" height="16" rx="3" fill="#A9B4BE" stroke="#1C2127" stroke-width="1.5"/>
  <g stroke="#1C2127" stroke-width="1.5" stroke-linecap="round">
    <line x1="176" y1="192" x2="208" y2="192"/>
    <line x1="176" y1="208" x2="208" y2="208"/>
    <line x1="176" y1="224" x2="208" y2="224"/>
    <line x1="176" y1="240" x2="208" y2="240"/>
    <line x1="176" y1="256" x2="208" y2="256"/>
    <line x1="176" y1="272" x2="208" y2="272"/>
    <line x1="176" y1="288" x2="208" y2="288"/>
  </g>
  <!-- funnel: the dock, filled with ore -->
  <polygon points="132,300 252,300 236,374 148,374" fill="#7D8893" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="146,308 238,308 226,364 158,364" fill="#A67C00" stroke="#1C2127" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="146,308 238,308 232,336 150,336" fill="#F2B705"/>
  <polygon points="146,308 200,308 188,326 150,336" fill="#FFD84D"/>
  <polyline points="150,336 232,336" fill="none" stroke="#A67C00" stroke-width="2"/>
  <polyline points="136,304 150,368" fill="none" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round"/>
  <!-- silos: rim, lid, hatch -->
  <g stroke="#1C2127">
    <circle cx="106" cy="104" r="70" fill="#7D8893" stroke-width="3"/>
    <circle cx="262" cy="74" r="38" fill="#7D8893" stroke-width="3"/>
    <circle cx="322" cy="142" r="38" fill="#7D8893" stroke-width="3"/>
    <circle cx="106" cy="104" r="34" fill="#5B6670" stroke-width="1.5"/>
    <circle cx="262" cy="74" r="18" fill="#5B6670" stroke-width="1.5"/>
    <circle cx="322" cy="142" r="18" fill="#5B6670" stroke-width="1.5"/>
    <circle cx="106" cy="104" r="16" fill="#A9B4BE" stroke-width="1.5"/>
    <circle cx="262" cy="74" r="7" fill="#A9B4BE" stroke-width="1.5"/>
    <circle cx="322" cy="142" r="7" fill="#A9B4BE" stroke-width="1.5"/>
  </g>
  <g fill="none" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round">
    <path d="M40 104 A66 66 0 0 1 106 38"/>
    <path d="M228 74 A34 34 0 0 1 262 40"/>
    <path d="M288 142 A34 34 0 0 1 322 108"/>
  </g>
</svg>
