<!-- Power plant, hull layer, oblique 3/4 view: a ground point (x, y) is drawn at (x, y + 96) and a point h px up h px higher; the canvas is 256 x 352 and the 2x2 footprint is its bottom 256 x 256. -->
<!-- Silhouette: a tall slender banded chimney and a fat flared cooling tower with a plume of steam stand behind a long olive-roofed turbine hall with arched windows, and a fenced yard of two finned transformer tanks and a kiosk fills the south-east corner. -->
