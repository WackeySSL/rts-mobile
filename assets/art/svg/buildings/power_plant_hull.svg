    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d7f78"/><stop offset="1" stop-color="#4f514d"/></linearGradient>
    <linearGradient id="boxT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9aa5a8"/><stop offset="1" stop-color="#7c878a"/></linearGradient>
    <linearGradient id="boxS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b7679"/><stop offset="1" stop-color="#454f52"/></linearGradient>
