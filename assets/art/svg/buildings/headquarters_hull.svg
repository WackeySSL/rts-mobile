<!-- Headquarters, hull layer, oblique 3/4 view: a ground point (x, y) is drawn at (x, y + 96) and a point h px up h px higher; the canvas is 384 x 480 and the 3x3 footprint is its bottom 384 x 384. -->
<!-- Silhouette: a wide two-storey concrete block with a parapet roof, a taller control tower with a lattice mast at its west end, a lift housing, vents and a dish on the roof, and a flat porch canopy on two pillars at the middle of the south wall over a paved forecourt with a flagpole. -->
<svg xmlns="http://www.w3.org/2000/svg" width="384" height="480" viewBox="0 0 384 480">
  <defs>
    <clipPath id="apron"><polygon points="14,26 40,10 120,6 230,12 330,6 366,22 378,60 372,150 380,240 374,330 360,372 300,378 200,374 120,378 50,374 16,358 8,300 12,200 6,120 10,60"/></clipPath>
    <linearGradient id="tar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#62676a"/><stop offset="1" stop-color="#4a4f53"/></linearGradient>
    <linearGradient id="pave" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b9c94"/><stop offset="1" stop-color="#7f817b"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9aaa2"/><stop offset="1" stop-color="#8d8f88"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a7c75"/><stop offset="1" stop-color="#4b4d4a"/></linearGradient>
    <linearGradient id="wallT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#85877f"/><stop offset="1" stop-color="#5a5c58"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bdbeb6"/><stop offset="1" stop-color="#9c9e97"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a5e63"/><stop offset="1" stop-color="#1c272b"/></linearGradient>
    <linearGradient id="ao" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1112" stop-opacity="0"/><stop offset="1" stop-color="#0d1112" stop-opacity="0.55"/></linearGradient>
    <linearGradient id="aoTop" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0d1112" stop-opacity="0"/><stop offset="1" stop-color="#0d1112" stop-opacity="0.45"/></linearGradient>
    <linearGradient id="pipeV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a9b1b4"/><stop offset="0.35" stop-color="#737c7f"/><stop offset="1" stop-color="#3b4145"/></linearGradient>
    <linearGradient id="pipeH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9b1b4"/><stop offset="0.35" stop-color="#737c7f"/><stop offset="1" stop-color="#3b4145"/></linearGradient>
    <radialGradient id="dish" cx="0.5" cy="0.5" r="0.5" fx="0.34" fy="0.3"><stop offset="0" stop-color="#e2e4dc"/><stop offset="0.6" stop-color="#b3b6ad"/><stop offset="1" stop-color="#76787a"/></radialGradient>
    <radialGradient id="stain"><stop offset="0" stop-color="#101314" stop-opacity="0.55"/><stop offset="1" stop-color="#101314" stop-opacity="0"/></radialGradient>
    <radialGradient id="rust"><stop offset="0" stop-color="#8f5731" stop-opacity="0.5"/><stop offset="1" stop-color="#8f5731" stop-opacity="0"/></radialGradient>
