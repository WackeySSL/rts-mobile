<!-- Headquarters, hull layer: drawn first, holds the ground shadow of the whole building. -->
<!-- Silhouette: a square pad with cut corners carrying a plus-shaped roof, a round dome where the four arms cross and a small square deck in each corner. -->
<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <!-- ground shadow, offset (4,4), flattened as one group -->
  <g transform="translate(4 4)" opacity="0.25" fill="#000000">
    <polygon points="66,6 318,6 378,66 378,318 318,378 66,378 6,318 6,66"/>
  </g>
  <!-- pad: the lowest plane -->
  <polygon points="66,6 318,6 378,66 378,318 318,378 66,378 6,318 6,66" fill="#5B6670" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="11,318 11,66 66,11 318,11" fill="none" stroke="#7D8893" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- painted lane line round the pad -->
  <polygon points="72,22 312,22 362,72 362,312 312,362 72,362 22,312 22,72" fill="none" stroke="#7D8893" stroke-width="2" stroke-dasharray="12 8" stroke-linejoin="round"/>
  <!-- corner decks, each a plinth for a team plate -->
  <g fill="#7D8893" stroke="#1C2127" stroke-width="1.5" stroke-linejoin="round">
    <rect x="40" y="40" width="56" height="56" rx="6"/>
    <rect x="288" y="40" width="56" height="56" rx="6"/>
    <rect x="40" y="288" width="56" height="56" rx="6"/>
    <rect x="288" y="288" width="56" height="56" rx="6"/>
  </g>
  <g fill="none" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="43,92 43,43 92,43"/>
    <polyline points="291,92 291,43 340,43"/>
    <polyline points="43,340 43,291 92,291"/>
    <polyline points="291,340 291,291 340,291"/>
  </g>
  <!-- plus-shaped roof -->
  <polygon points="132,24 252,24 252,132 360,132 360,252 252,252 252,360 132,360 132,252 24,252 24,132 132,132" fill="#7D8893" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <!-- light edge on the roof sides that face the top left -->
  <g fill="none" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="28,248 28,136 136,136 136,28 248,28"/>
    <polyline points="256,136 356,136"/>
    <polyline points="136,256 136,356"/>
  </g>
  <!-- arm-end plinths for the team plates, in the darkest olive -->
  <g fill="#4E5A3A" stroke="#1C2127" stroke-width="1.5" stroke-linejoin="round">
    <rect x="140" y="32" width="104" height="64" rx="4"/>
    <rect x="288" y="140" width="64" height="104" rx="4"/>
    <rect x="140" y="288" width="104" height="64" rx="4"/>
    <rect x="32" y="140" width="64" height="104" rx="4"/>
  </g>
  <!-- conduits from the dome to the plinths -->
  <g fill="#5B6670" stroke="#1C2127" stroke-width="1.5" stroke-linejoin="round">
    <rect x="180" y="98" width="24" height="34"/>
    <rect x="180" y="252" width="24" height="34"/>
    <rect x="98" y="180" width="34" height="24"/>
    <rect x="252" y="180" width="34" height="24"/>
  </g>
  <!-- rivet hatches in the inner corners of the crossing -->
  <g fill="#5B6670" stroke="#1C2127" stroke-width="1.5">
    <circle cx="148" cy="148" r="8"/>
    <circle cx="236" cy="148" r="8"/>
    <circle cx="148" cy="236" r="8"/>
    <circle cx="236" cy="236" r="8"/>
  </g>
  <!-- dome -->
  <circle cx="192" cy="192" r="60" fill="#5B6670" stroke="#1C2127" stroke-width="3"/>
  <circle cx="192" cy="192" r="48" fill="#7D8893" stroke="#1C2127" stroke-width="1.5"/>
  <path d="M152 192 A40 40 0 0 1 192 152" fill="none" stroke="#A9B4BE" stroke-width="3" stroke-linecap="round"/>
  <path d="M232 192 A40 40 0 0 1 192 232" fill="none" stroke="#5B6670" stroke-width="3" stroke-linecap="round"/>
  <circle cx="192" cy="192" r="14" fill="#A9B4BE" stroke="#1C2127" stroke-width="1.5"/>
  <g stroke="#5B6670" stroke-width="2" stroke-linecap="round">
    <line x1="185" y1="192" x2="199" y2="192"/>
    <line x1="192" y1="185" x2="192" y2="199"/>
  </g>
</svg>
