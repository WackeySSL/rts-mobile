<!-- Vehicle factory, team layer: white and grey only, tinted at run time, drawn over the hull; the same 384 x 480 canvas. -->
<!-- Shape: a painted stripe on every second slope of the sawtooth roof and along its south eave, a band under the wall cornice on both wings, a stripe along the crane jib, a lid on the crate on the hook and a pennant on the flagpole. -->
<svg xmlns="http://www.w3.org/2000/svg" width="384" height="480" viewBox="0 0 384 480">
  <g fill="#FFFFFF" stroke="#4D4D4D" stroke-width="1.5" stroke-linejoin="round">
    <!-- roof: the 1st, 3rd and 5th slope and the eave gutter -->
    <rect x="27" y="93" width="330" height="9"/>
    <rect x="27" y="171" width="330" height="9"/>
    <rect x="27" y="248" width="330" height="9"/>
    <rect x="26" y="278.5" width="332" height="5"/>
    <!-- wall: a band under the cornice on each wing of the bay -->
    <rect x="35" y="296" width="91" height="5"/>
    <rect x="258" y="296" width="91" height="5"/>
    <!-- crane jib stripe and the lid of the crate on the hook -->
    <rect x="152" y="58.5" width="204" height="5"/>
    <rect x="183" y="137" width="42" height="6"/>
  </g>
  <g fill="#BFBFBF"><rect x="28" y="99.5" width="328" height="2"/><rect x="28" y="177.5" width="328" height="2"/><rect x="28" y="254.5" width="328" height="2"/></g>
  <!-- pennant on the flagpole -->
  <g stroke="#4D4D4D" stroke-width="1.5" stroke-linejoin="round">
    <path d="M343 374 C354 370 362 378 376 374 L376 392 C362 396 354 388 343 392 Z" fill="#FFFFFF"/>
    <path d="M343 383 C354 379 362 387 376 383 L376 386 C362 390 354 382 343 386 Z" fill="#BFBFBF" stroke="none"/>
  </g>
</svg>
