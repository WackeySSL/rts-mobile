<!-- Headquarters, team layer: white and grey only, tinted at run time, drawn over the hull; the same 384 x 480 canvas. -->
<!-- Shape: a painted coping round the roof, a broad stripe under the south cornice, a solid ring round two stacked chevrons on the roof, a band on the tower wall, a panel on the lift housing, a stripe on the porch canopy and a pennant on the flagpole. -->
<svg xmlns="http://www.w3.org/2000/svg" width="384" height="480" viewBox="0 0 384 480">
  <g fill="#FFFFFF" stroke="#4D4D4D" stroke-width="1.5" stroke-linejoin="round">
    <!-- coping: four bars round the roof edge, 2 px inside the concrete -->
    <rect x="43" y="154" width="298" height="4"/>
    <rect x="42.5" y="159" width="4" height="184"/>
    <rect x="337.5" y="159" width="4" height="184"/>
    <rect x="43" y="346" width="298" height="4"/>
    <!-- stripe along the south wall under the cornice, and the tower wall band -->
    <rect x="42" y="355" width="300" height="9"/>
    <rect x="56" y="208" width="88" height="6"/>
    <!-- lift housing roof panel and porch canopy stripe -->
    <rect x="292" y="200" width="40" height="22" rx="2"/>
    <rect x="144" y="403.5" width="96" height="5"/>
  </g>
  <!-- command roundel on the roof: a solid ring round two stacked chevrons, each with a dark edge -->
  <g fill="none">
    <circle cx="196" cy="256" r="44" stroke="#4D4D4D" stroke-width="10"/>
    <circle cx="196" cy="256" r="44" stroke="#FFFFFF" stroke-width="7"/>
  </g>
  <g fill="#FFFFFF" stroke="#4D4D4D" stroke-width="1.5" stroke-linejoin="round">
    <path d="M171 249.5 L196 232.5 L221 249.5 V259.5 L196 242.5 L171 259.5 Z"/>
    <path d="M171 269.5 L196 252.5 L221 269.5 V279.5 L196 262.5 L171 279.5 Z"/>
  </g>
  <!-- grey shade on the lower edge of the long stripes -->
  <g fill="#BFBFBF"><rect x="43" y="361" width="298" height="2"/><rect x="43" y="348.5" width="298" height="1.5"/><rect x="57" y="212" width="86" height="1.5"/></g>
  <!-- pennant on the flagpole -->
  <g stroke="#4D4D4D" stroke-width="1.5" stroke-linejoin="round">
    <path d="M304 373 C316 369 326 378 340 374 L340 393 C326 397 316 388 304 392 Z" fill="#FFFFFF"/>
    <path d="M304 383 C316 379 326 388 340 384 L340 387 C326 391 316 382 304 386 Z" fill="#BFBFBF" stroke="none"/>
  </g>
</svg>
