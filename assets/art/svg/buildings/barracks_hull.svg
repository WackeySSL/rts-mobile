<!-- Barracks, hull layer, oblique 3/4 view: a ground point (x, y) is drawn at (x, y + 96) and a point h px up h px higher; the canvas is 256 x 352 and the 2x2 footprint is its bottom 256 x 256. -->
<!-- Silhouette: three olive corrugated huts form a U round a gravel yard that opens to the south, a long one across the north with stovepipes and a row of doors and two shorter ones down the west and east edges showing plank gable ends, with a flagpole inside a sandbag ring in the yard and a sandbag bastion on each side of the open end. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="352" viewBox="0 0 256 352">
  <defs>
    <clipPath id="apron"><polygon points="8,18 40,6 130,4 230,8 250,24 252,130 246,236 238,252 140,254 120,252 20,254 6,240 4,130"/></clipPath>
    <linearGradient id="dirt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a7556"/><stop offset="1" stop-color="#6f5f45"/></linearGradient>
    <linearGradient id="gravel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a39373"/><stop offset="1" stop-color="#85775c"/></linearGradient>
    <linearGradient id="roofL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a9a67"/><stop offset="1" stop-color="#778858"/></linearGradient>
    <linearGradient id="roofD" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5f6e43"/><stop offset="1" stop-color="#46532f"/></linearGradient>
    <linearGradient id="roofN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8c9a6b"/><stop offset="1" stop-color="#78885b"/></linearGradient>
    <linearGradient id="roofS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#65744a"/><stop offset="1" stop-color="#4a5733"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b6842"/><stop offset="1" stop-color="#363f2b"/></linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a7849"/><stop offset="1" stop-color="#3f4a30"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a5e63"/><stop offset="1" stop-color="#1c272b"/></linearGradient>
    <linearGradient id="ao" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1112" stop-opacity="0"/><stop offset="1" stop-color="#0d1112" stop-opacity="0.55"/></linearGradient>
    <linearGradient id="pipeV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a9296"/><stop offset="0.35" stop-color="#5d6669"/><stop offset="1" stop-color="#2c3236"/></linearGradient>
    <radialGradient id="stain"><stop offset="0" stop-color="#101314" stop-opacity="0.5"/><stop offset="1" stop-color="#101314" stop-opacity="0"/></radialGradient>
    <radialGradient id="rust"><stop offset="0" stop-color="#8f5731" stop-opacity="0.5"/><stop offset="1" stop-color="#8f5731" stop-opacity="0"/></radialGradient>
    <g id="huts"><rect x="18" y="20" width="220" height="68" rx="2"/><rect x="18" y="100" width="60" height="114" rx="2"/><rect x="178" y="100" width="60" height="114" rx="2"/></g>
    <g id="feet"><rect x="12" y="14" width="232" height="80" rx="4"/><rect x="12" y="94" width="72" height="126" rx="4"/><rect x="172" y="94" width="72" height="126" rx="4"/></g>
  </defs>

  <!-- ground: ragged packed earth, the gravel yard, tracks and the soft shadows of the huts -->
  <g transform="translate(0 96)">
    <polygon points="4,16 36,2 130,0 232,4 254,22 255,130 250,238 240,256 140,256 120,255 18,256 2,240 0,130" fill="#5f553f" opacity="0.5"/>
    <polygon points="8,18 40,6 130,4 230,8 250,24 252,130 246,236 238,252 140,254 120,252 20,254 6,240 4,130" fill="url(#dirt)"/>
    <g clip-path="url(#apron)">
      <polygon points="80,90 176,90 178,240 160,248 100,248 80,240" fill="url(#gravel)"/>
      <polygon points="80,90 176,90 178,240 160,248 100,248 80,240" fill="none" stroke="#4d4429" stroke-width="2" stroke-dasharray="15 3 21 4" opacity="0.6"/>
      <path d="M100 100 C104 150 100 190 108 246 M150 100 C146 150 152 190 146 246" fill="none" stroke="#5a4e36" stroke-width="6" stroke-linecap="round" opacity="0.22"/>
      <g fill="#6b5f46" opacity="0.5"><circle cx="96" cy="130" r="3"/><circle cx="160" cy="170" r="2.5"/><circle cx="110" cy="212" r="3"/><circle cx="148" cy="120" r="2"/><circle cx="130" cy="228" r="2.5"/></g>
      <ellipse cx="50" cy="232" rx="26" ry="8" fill="url(#stain)"/>
      <ellipse cx="206" cy="236" rx="22" ry="7" fill="url(#stain)"/>
      <ellipse cx="128" cy="100" rx="40" ry="8" fill="url(#stain)" opacity="0.6"/>
      <g fill="none" stroke="#2a2418" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
        <path d="M24 100 L36 108 L44 104"/><path d="M214 100 L224 110 L220 120"/>
      </g>
      <g fill="#0d1112" stroke="#0d1112" stroke-linejoin="round">
        <g opacity="0.07" stroke-width="16"><use href="#huts" x="16" y="14"/></g>
        <g opacity="0.12" stroke-width="8"><use href="#huts" x="16" y="14"/></g>
        <g opacity="0.2" stroke-width="0"><use href="#huts" x="16" y="14"/></g>
      </g>
      <g fill="none" stroke="#0d1112" stroke-linejoin="round">
        <g opacity="0.05" stroke-width="20"><use href="#feet"/></g>
        <g opacity="0.07" stroke-width="10"><use href="#feet"/></g>
        <g opacity="0.1" stroke-width="4"><use href="#feet"/></g>
      </g>
    </g>
    <polygon points="8,18 40,6 130,4 230,8 250,24 252,130 246,236 238,252 140,254 120,252 20,254 6,240 4,130" fill="none" stroke="#2a2418" stroke-width="2.5" stroke-dasharray="17 3 24 4 12 2" stroke-linejoin="round" opacity="0.55"/>
  </g>

  <!-- north hut: the thin north slope, the long south slope with two stovepipes, the south wall with doors and windows -->
  <polygon points="18,84 238,84 238,98 18,98" fill="url(#roofN)" stroke="#2a3020" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="18,98 238,98 238,152 18,152" fill="url(#roofS)" stroke="#2a3020" stroke-width="2" stroke-linejoin="round"/>
  <line x1="18" y1="125" x2="238" y2="125" stroke="#1f281a" stroke-width="54" stroke-dasharray="1.5 6.5" opacity="0.4"/>
  <line x1="19.5" y1="125" x2="239.5" y2="125" stroke="#a9b887" stroke-width="54" stroke-dasharray="1 7.5" opacity="0.15"/>
  <rect x="18" y="96" width="220" height="4" fill="#9aa87a"/><line x1="18" y1="96.5" x2="238" y2="96.5" stroke="#dce5c4" stroke-width="1.5"/>
  <g stroke="#2a3020" stroke-width="1.2" opacity="0.5"><path d="M66 100 V150 M114 100 V150 M162 100 V150 M210 100 V150"/></g>
  <ellipse cx="150" cy="140" rx="30" ry="5" fill="url(#rust)"/>
  <g>
    <rect x="68" y="108" width="7" height="22" fill="url(#pipeV)" stroke="#1c2022" stroke-width="1.5"/>
    <rect x="65" y="104" width="13" height="5" fill="#3a4044" stroke="#1c2022" stroke-width="1.5"/>
    <rect x="188" y="108" width="7" height="22" fill="url(#pipeV)" stroke="#1c2022" stroke-width="1.5"/>
    <rect x="185" y="104" width="13" height="5" fill="#3a4044" stroke="#1c2022" stroke-width="1.5"/>
  </g>
  <rect x="16" y="148" width="224" height="6" fill="#3d4a2c" stroke="#1f2626" stroke-width="1.5"/><rect x="16" y="148" width="224" height="2" fill="#a4b27f"/>
  <rect x="18" y="154" width="220" height="30" fill="url(#wall)"/>
  <line x1="18" y1="169" x2="238" y2="169" stroke="#161d12" stroke-width="30" stroke-dasharray="1.5 6.5" opacity="0.3"/>
  <path d="M18 162 H238 M18 176 H238" fill="none" stroke="#161d12" stroke-width="1.2" opacity="0.35"/>
  <g fill="#3a2f22" stroke="#161b12" stroke-width="1.5"><rect x="36" y="160" width="18" height="24"/><rect x="119" y="160" width="18" height="24"/><rect x="202" y="160" width="18" height="24"/></g>
  <g stroke="#1a140d" stroke-width="1.2" opacity="0.7"><path d="M45 160 V184 M128 160 V184 M211 160 V184"/></g>
  <g fill="#9a9c94"><rect x="34" y="184" width="22" height="3"/><rect x="117" y="184" width="22" height="3"/><rect x="200" y="184" width="22" height="3"/></g>
  <g fill="url(#glass)" stroke="#161b1c" stroke-width="1.5"><rect x="64" y="162" width="24" height="14"/><rect x="92" y="162" width="24" height="14"/><rect x="144" y="162" width="24" height="14"/><rect x="172" y="162" width="24" height="14"/></g>
  <g stroke="#a4bcc0" stroke-width="1.5" opacity="0.5" stroke-linecap="round"><path d="M67 174 L76 164 M95 174 L104 164 M147 174 L156 164 M175 174 L184 164"/></g>
  <g fill="#b9bab2" opacity="0.7"><rect x="62" y="176" width="28" height="2"/><rect x="90" y="176" width="28" height="2"/><rect x="142" y="176" width="28" height="2"/><rect x="170" y="176" width="28" height="2"/></g>
  <rect x="18" y="154" width="3" height="30" fill="#8a9a67" opacity="0.6"/><rect x="235" y="154" width="3" height="30" fill="#161d12" opacity="0.5"/>
  <rect x="18" y="172" width="220" height="12" fill="url(#ao)"/>
  <g>
    <path d="M232 168 V176 A7 7 0 0 0 246 176 V166 Z" fill="#68704d" stroke="#1c2022" stroke-width="1.5" transform="translate(-6 4)"/>
    <circle cx="233" cy="170" r="7" fill="#68704d" stroke="#1c2022" stroke-width="1.5"/><circle cx="233" cy="170" r="4.5" fill="none" stroke="#161a1b" stroke-width="1.5" opacity="0.7"/><circle cx="231" cy="168" r="1.8" fill="#cdd3c1" opacity="0.5"/>
  </g>

  <!-- west wing: the west slope (lit), the east slope, then the plank gable end that faces south -->
  <polygon points="18,164 18,278 48,258 48,144" fill="url(#roofL)" stroke="#2a3020" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="48,144 48,258 78,278 78,164" fill="url(#roofD)" stroke="#2a3020" stroke-width="2" stroke-linejoin="round"/>
  <line x1="33" y1="140" x2="33" y2="280" stroke="#1f281a" stroke-width="30" stroke-dasharray="1.5 6.5" opacity="0.32"/>
  <line x1="63" y1="140" x2="63" y2="280" stroke="#161d12" stroke-width="30" stroke-dasharray="1.5 6.5" opacity="0.42"/>
  <line x1="33" y1="141.5" x2="33" y2="281.5" stroke="#cdd9ac" stroke-width="30" stroke-dasharray="1 7.5" opacity="0.18"/>
  <path d="M48 144 V258" fill="none" stroke="#dce5c4" stroke-width="2.5"/>
  <polygon points="18,310 18,278 48,258 78,278 78,310" fill="url(#plank)" stroke="#2a3020" stroke-width="2" stroke-linejoin="round"/>
  <line x1="19" y1="296" x2="77" y2="296" stroke="#161d12" stroke-width="50" stroke-dasharray="1.5 6.5" opacity="0.35"/>
  <path d="M18 278 L48 258 L78 278" fill="none" stroke="#9aa87a" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="37" y="286" width="22" height="24" fill="#3a2f22" stroke="#161b12" stroke-width="1.5"/>
  <path d="M48 286 V310" stroke="#1a140d" stroke-width="1.2" opacity="0.7"/>
  <rect x="35" y="310" width="26" height="3" fill="#9a9c94"/>
  <rect x="62" y="283" width="12" height="12" fill="url(#glass)" stroke="#161b1c" stroke-width="1.5"/>
  <rect x="18" y="298" width="60" height="12" fill="url(#ao)"/>

  <!-- east wing -->
  <polygon points="178,164 178,278 208,258 208,144" fill="url(#roofL)" stroke="#2a3020" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="208,144 208,258 238,278 238,164" fill="url(#roofD)" stroke="#2a3020" stroke-width="2" stroke-linejoin="round"/>
  <line x1="193" y1="140" x2="193" y2="280" stroke="#1f281a" stroke-width="30" stroke-dasharray="1.5 6.5" opacity="0.32"/>
  <line x1="223" y1="140" x2="223" y2="280" stroke="#161d12" stroke-width="30" stroke-dasharray="1.5 6.5" opacity="0.42"/>
  <line x1="193" y1="141.5" x2="193" y2="281.5" stroke="#cdd9ac" stroke-width="30" stroke-dasharray="1 7.5" opacity="0.18"/>
  <path d="M208 144 V258" fill="none" stroke="#dce5c4" stroke-width="2.5"/>
  <polygon points="178,310 178,278 208,258 238,278 238,310" fill="url(#plank)" stroke="#2a3020" stroke-width="2" stroke-linejoin="round"/>
  <line x1="179" y1="296" x2="237" y2="296" stroke="#161d12" stroke-width="50" stroke-dasharray="1.5 6.5" opacity="0.35"/>
  <path d="M178 278 L208 258 L238 278" fill="none" stroke="#9aa87a" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="197" y="286" width="22" height="24" fill="#3a2f22" stroke="#161b12" stroke-width="1.5"/>
  <path d="M208 286 V310" stroke="#1a140d" stroke-width="1.2" opacity="0.7"/>
  <rect x="195" y="310" width="26" height="3" fill="#9a9c94"/>
  <rect x="182" y="283" width="12" height="12" fill="url(#glass)" stroke="#161b1c" stroke-width="1.5"/>
  <rect x="178" y="298" width="60" height="12" fill="url(#ao)"/>
  <rect x="182" y="296" width="3" height="14" fill="#8f5731" opacity="0.3"/>

  <!-- yard: a ring of sandbags round the flagpole, then the pole -->
  <ellipse cx="130" cy="268" rx="22" ry="7" fill="#0d1112" opacity="0.3"/>
  <circle cx="128" cy="262" r="17" fill="none" stroke="#4d4429" stroke-width="12"/>
  <circle cx="128" cy="262" r="17" fill="none" stroke="#a99869" stroke-width="9.5" stroke-dasharray="11 2.2"/>
  <circle cx="128" cy="262" r="15" fill="none" stroke="#cdbd8c" stroke-width="2" stroke-dasharray="7 6" opacity="0.7" transform="translate(-1 -1)"/>
  <circle cx="128" cy="262" r="11" fill="#6b5f46"/>
  <rect x="123" y="258" width="10" height="6" fill="#43494c" stroke="#1c2022" stroke-width="1.5"/>
  <line x1="128" y1="261" x2="128" y2="160" stroke="#2a2f31" stroke-width="3.5" stroke-linecap="round"/><line x1="127" y1="261" x2="127" y2="162" stroke="#a8b0b2" stroke-width="1" stroke-linecap="round"/>
  <circle cx="128" cy="158" r="3" fill="#c8ccc4" stroke="#1c2022" stroke-width="1"/>

  <!-- the two bastions that flank the open end -->
  <g fill="#a99869" stroke="#4d4429" stroke-width="1.5" stroke-linejoin="round">
    <rect x="86" y="330" width="22" height="12" rx="4"/><rect x="110" y="330" width="8" height="12" rx="4"/>
    <rect x="86" y="318" width="22" height="12" rx="4"/><rect x="94" y="306" width="22" height="12" rx="4"/>
    <rect x="140" y="330" width="22" height="12" rx="4"/><rect x="164" y="330" width="8" height="12" rx="4"/>
    <rect x="148" y="318" width="22" height="12" rx="4"/><rect x="140" y="306" width="22" height="12" rx="4"/>
  </g>
  <g stroke="#cdbd8c" stroke-width="2" stroke-linecap="round" opacity="0.8"><path d="M90 334 H102 M90 322 H102 M98 310 H110 M144 334 H156 M152 322 H164 M144 310 H156"/></g>
  <g stroke="#4d4429" stroke-width="1.5" opacity="0.6"><path d="M86 342 H118 M140 342 H172"/></g>
  <g>
    <path d="M122 336 V344 A8 8 0 0 0 138 344 V334 Z" fill="#8b5a3a" stroke="#1c2022" stroke-width="1.5"/>
    <circle cx="130" cy="336" r="8" fill="#8b5a3a" stroke="#1c2022" stroke-width="1.5"/><circle cx="130" cy="336" r="5" fill="none" stroke="#161a1b" stroke-width="1.5" opacity="0.7"/><circle cx="127" cy="333" r="2" fill="#cdd3c1" opacity="0.5"/>
  </g>
</svg>
