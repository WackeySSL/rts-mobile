<!-- Water diamond b (Heron Fords): one 128 x 64 tile of river water, the deep blue base to every edge. -->
<!-- Pattern: Deep blue river with two long mid-blue current lines that run along the +gx axis and leave the tile at the same two points in a and in b, so they flow on from tile to tile, a short pale crest on each, two short ripples between them and two darker swells. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64" viewBox="0 0 128 64">
<defs><clipPath id="inner"><polygon points="64,5.1 117.8,32 64,58.9 10.2,32"/></clipPath><clipPath id="reach"><polygon points="64,-1.3 130.6,32 64,65.3 -2.6,32"/></clipPath></defs>
<polygon points="64,-1.3 130.6,32 64,65.3 -2.6,32" fill="#2A5978"/>
<polygon points="83.5,40.5 73.3,41.3 61.6,40.8 55.9,35.1 55.7,29.9 60.9,25.3 72.6,27.1 83,29.9 88,35.6" fill="#285574"/>
<polygon points="48,43.2 40.5,43.5 31.2,42 27.8,37.3 29.1,33.8 35.9,32.1 44.1,35.6 50.2,39.6" fill="#306180"/>
<g clip-path="url(#reach)">
<polyline points="46.1,7.7 50.2,10.7 54.5,13.7 60.1,16 66.9,17.7 74.3,19.2 81,20.9 86.3,23.4 90.1,26.6 93.1,30.3 96.3,33.8 100.7,36.7 106.5,38.9 112.6,41" fill="none" stroke="#3C7396" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="17.9,21.8 23.5,24.1 29.8,26 35.9,28.1 40.9,30.7 44.7,34 47.8,37.5 51.1,41 55.4,44 60.9,46.3 67.5,48.2 74,50 79.7,52.3 84.5,55" fill="none" stroke="#3C7396" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g clip-path="url(#inner)">
<polyline points="66.9,16.5 74.3,18 81,19.7" fill="none" stroke="#8FBBD2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="51.1,39.8 55.4,42.8 60.9,45.1" fill="none" stroke="#8FBBD2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="57,29.1 60.8,31 64.6,33 68.5,34.9" fill="none" stroke="#3C7396" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="58.5,27.6 62.3,29.5 66.1,31.5" fill="none" stroke="#8FBBD2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="80.6,37.8 84.5,39.7 88.3,41.6 92.2,43.5" fill="none" stroke="#3C7396" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="82.1,36.3 86,38.2 89.8,40.1" fill="none" stroke="#8FBBD2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
