<!-- Water diamond a (Heron Fords): one 128 x 64 tile of river water, the deep blue base to every edge. -->
<!-- Pattern: Deep blue river with two long mid-blue current lines that run along the +gx axis and leave the tile at the same two points in a and in b, so they flow on from tile to tile, a short pale crest on each, two short ripples between them and two darker swells. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64" viewBox="0 0 128 64">
<defs><clipPath id="inner"><polygon points="64,5.1 117.8,32 64,58.9 10.2,32"/></clipPath><clipPath id="reach"><polygon points="64,-1.3 130.6,32 64,65.3 -2.6,32"/></clipPath></defs>
<polygon points="64,-1.3 130.6,32 64,65.3 -2.6,32" fill="#2A5978"/>
<polygon points="72.2,37.4 63.1,40 52.6,36.5 43.3,32.3 43.4,26.6 51.9,24.1 62.3,22.6 71.4,27.3 74.9,32.6" fill="#285574"/>
<polygon points="61.9,50.1 55,51.7 46.8,48.3 40.6,44.2 42.4,40.4 50.5,40.4 59.6,41.9 63.5,46.5" fill="#306180"/>
<g clip-path="url(#reach)">
<polyline points="46.1,7.7 51.3,10.2 57.6,12.2 64.3,13.9 70.3,16.1 74.8,18.9 78,22.4 80.7,26.2 83.9,29.7 88.5,32.6 94.4,34.7 101.1,36.5 107.5,38.4 112.6,41" fill="none" stroke="#3C7396" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="17.9,21.8 22.3,24.7 27.2,27.3 33.4,29.4 40.2,31.1 46.8,32.9 52.4,35.2 56.7,38.2 60,41.7 63.2,45.2 67.2,48.3 72.4,50.8 78.6,52.9 84.5,55" fill="none" stroke="#3C7396" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g clip-path="url(#inner)">
<polyline points="78,21.2 80.7,25 83.9,28.5" fill="none" stroke="#8FBBD2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="56.7,37 60,40.5 63.2,44" fill="none" stroke="#8FBBD2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="52.5,25 56.3,26.9 60.2,28.8 64,30.7" fill="none" stroke="#3C7396" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="54,23.5 57.8,25.4 61.7,27.3" fill="none" stroke="#8FBBD2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="69.8,36.8 73.6,38.7 77.4,40.6 81.3,42.6" fill="none" stroke="#3C7396" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="71.3,35.3 75.1,37.2 78.9,39.1" fill="none" stroke="#8FBBD2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
