<g transform="translate(2 338)"><polygon points="64,4 77,37 101.5,34.1 89.3,58.2 118.6,76.5 89,84 83.1,103.6 64,92 38,118.1 40.5,82.7 15.3,75.1 38.7,58.2 21.8,30.3 50.1,35.2" fill="#FFD84D" stroke="#2C2C2C" stroke-width="3" stroke-linejoin="round"/><polygon points="64,28 71.8,47.8 86.5,46 79.2,60.5 96.8,71.5 79,76 75.5,87.8 64,80.8 48.4,96.4 49.9,75.2 34.8,70.7 48.8,60.5 38.7,43.8 55.7,46.7" fill="#FFE98A"/><circle cx="64" cy="64" r="17" fill="#FFF8D2"/><circle cx="64" cy="64" r="8.4" fill="#FFFFFF"/></g>
