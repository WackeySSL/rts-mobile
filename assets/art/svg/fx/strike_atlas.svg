<g transform="translate(270 82)"><polygon points="66,16 50,28.1 18,28.1 2,16 18,3.9 50,3.9" fill="#A8F5B0" stroke="#1F5C3A" stroke-width="4" stroke-linejoin="round"/><polygon points="56,16 45,24 23,24 12,16 23,8 45,8" fill="#FFFFFF"/><polygon points="66,16 50,28.1 18,28.1 2,16 18,3.9 50,3.9" fill="none" stroke="#D8FFE0" stroke-width="1.5" stroke-linejoin="round"/></g>
