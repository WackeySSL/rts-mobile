<!-- lance_down: a dark auger lance, point down, a hot yellow-white burn streaming above its collar -->
<use href="#lance" transform="translate(2 2)"/>
<!-- lance_up: the same lance upside down, point up, the burn streaming below -->
<use href="#lance" transform="translate(78 326) scale(1 -1)"/>
<!-- trail: a tapering yellow-white streak that fades towards its top, stretched along the fall -->
<g transform="translate(152 0)"><polygon points="16,0 29,80 31,128 1,128 3,80" fill="url(#tr)"/></g>
<!-- shadow: a flat dark ellipse that grows under the falling lance -->
