<!-- Pulse seed mark (known enemy): a mine of the Lumen Accord planted in the ground, in the faction's key triad (the bake swaps it for the player's), 144 x 96 px at 2x, ground point (72, 60). -->
<!-- Silhouette: a flat white hexagonal plate with a team-colour ring on it, a tall white hexagonal spike rising from its middle and a mint light on the tip, inside a ring of dark dashes with a pale inner edge. -->
<svg xmlns="http://www.w3.org/2000/svg" width="144" height="96" viewBox="0 0 144 96">
<g transform="scale(1.5)">
  <!-- the notched rim of a known enemy mine: a ring of short dark dashes with a pale inner edge, no team colour -->
  <ellipse cx="48" cy="40" rx="42" ry="21" fill="none" stroke="#3B3F39" stroke-width="4" stroke-dasharray="8 6"/>
  <ellipse cx="48" cy="40" rx="39" ry="19.5" fill="none" stroke="#FFF1D6" stroke-width="1.5" stroke-dasharray="8 6"/>
  <g transform="translate(0 -2)">
