<!-- Surrender glyph: white and grey only, tinted at run time (the pause menu's Surrender button). -->
<!-- Shape: a slim upright pole with a round ball on its top and a broad foot, one long triangular pennant struck down to the foot of the pole and hanging from it to a low point. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- the pole and its ball -->
  <line x1="34" y1="26" x2="34" y2="106" stroke="#4D4D4D" stroke-width="18" stroke-linecap="round"/>
  <line x1="34" y1="26" x2="34" y2="106" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <circle cx="34" cy="17" r="8" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4"/>
  <!-- the pennant, struck down the pole to its foot and hanging to a low point -->
  <polygon points="42,62 42,94 112,90" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="42,78 42,94 112,90" fill="#BFBFBF" stroke="#BFBFBF" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="42,62 42,94 112,90" fill="none" stroke="#4D4D4D" stroke-width="5" stroke-linejoin="round"/>
  <!-- the foot -->
  <rect x="14" y="104" width="40" height="14" rx="5" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <rect x="19" y="111" width="30" height="3" rx="1.5" fill="#BFBFBF"/>
</svg>
