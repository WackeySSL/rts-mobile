  <circle cx="64" cy="64" r="52" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="5"/>
  <path d="M106.5,75.4 A44 44 0 0 1 49,105.3" fill="none" stroke="#BFBFBF" stroke-width="5"/>
  <!-- the mark -->
  <polygon points="55,28 73,28 69,72 59,72" fill="#4D4D4D" stroke="#4D4D4D" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="64" cy="94" r="9" fill="#4D4D4D"/>
</svg>
