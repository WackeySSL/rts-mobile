  <g fill="none">
    <circle cx="64" cy="64" r="47" stroke="#4D4D4D" stroke-width="22"/>
    <circle cx="64" cy="64" r="47" stroke="#FFFFFF" stroke-width="12"/>
    <path d="M114.3,68.4 A50.5 50.5 0 0 1 55.2,113.7" stroke="#BFBFBF" stroke-width="5"/>
  </g>
  <rect x="45" y="45" width="38" height="38" rx="7" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <rect x="50" y="72" width="28" height="6" rx="3" fill="#BFBFBF"/>
</svg>
