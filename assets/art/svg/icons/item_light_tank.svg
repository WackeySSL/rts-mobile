<!-- Light tank build icon: palette colours, one neutral grey team mark, drawn on a clear canvas for a tile of 64 dp or more. -->
<!-- Silhouette: a plain light tank shaped like an H on its side, two long round-ended track pods joined by a flat deck, a compact rounded-rear turret and one long barrel to the right. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- track pods -->
  <g fill="#5B6670" stroke="#1C2127" stroke-width="4" stroke-linejoin="round">
    <rect x="8" y="22" width="102" height="26" rx="10"/>
    <rect x="8" y="80" width="102" height="26" rx="10"/>
  </g>
  <g stroke="#A9B4BE" stroke-width="2.5" stroke-linecap="round">
    <line x1="18" y1="26" x2="100" y2="26"/>
    <line x1="18" y1="84" x2="100" y2="84"/>
  </g>
  <!-- deck -->
  <polygon points="20,48 92,48 102,56 102,72 92,80 20,80" fill="#4E5A3A" stroke="#1C2127" stroke-width="4" stroke-linejoin="round"/>
  <!-- neutral team plates -->
  <g fill="#9AA5B1" stroke="#1C2127" stroke-width="2">
    <rect x="20" y="30" width="82" height="10" rx="3"/>
    <rect x="20" y="88" width="82" height="10" rx="3"/>
    <rect x="22" y="52" width="13" height="24" rx="2"/>
  </g>
  <!-- barrel and muzzle block -->
  <rect x="94" y="58" width="22" height="12" fill="#7D8893" stroke="#1C2127" stroke-width="4" stroke-linejoin="round"/>
  <rect x="112" y="55" width="12" height="18" fill="#5B6670" stroke="#1C2127" stroke-width="4" stroke-linejoin="round"/>
  <!-- turret -->
  <path d="M38 54 Q38 45 47 45 L80 45 L94 55 L94 73 L80 83 L47 83 Q38 83 38 74 Z" fill="#6B7A4F" stroke="#1C2127" stroke-width="4" stroke-linejoin="round"/>
  <line x1="48" y1="51" x2="78" y2="51" stroke="#8C9A6B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="52" cy="60" r="6" fill="#7D8893" stroke="#1C2127" stroke-width="2"/>
</svg>
