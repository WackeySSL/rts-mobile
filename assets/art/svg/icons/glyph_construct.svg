<!-- Construct glyph: white and grey only, tinted at run time (the badge on a building site). -->
<!-- Shape: a tall tapering lattice mast of crossed braces on a flat foot, a long level jib across its top with a grey counterweight block behind and a hook hanging from the far end. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- the mast: legs, a rung and crossed braces; edge grey under, white over -->
  <g fill="none" stroke-linecap="round">
    <line x1="26" y1="69" x2="56" y2="69" stroke="#4D4D4D" stroke-width="10"/>
    <line x1="20" y1="106" x2="56" y2="69" stroke="#4D4D4D" stroke-width="10"/>
    <line x1="62" y1="106" x2="26" y2="69" stroke="#4D4D4D" stroke-width="10"/>
    <line x1="26" y1="69" x2="50" y2="32" stroke="#4D4D4D" stroke-width="10"/>
    <line x1="56" y1="69" x2="32" y2="32" stroke="#4D4D4D" stroke-width="10"/>
    <line x1="20" y1="106" x2="32" y2="32" stroke="#4D4D4D" stroke-width="18"/>
    <line x1="62" y1="106" x2="50" y2="32" stroke="#4D4D4D" stroke-width="18"/>
    <line x1="26" y1="69" x2="56" y2="69" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="20" y1="106" x2="56" y2="69" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="62" y1="106" x2="26" y2="69" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="26" y1="69" x2="50" y2="32" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="56" y1="69" x2="32" y2="32" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="20" y1="106" x2="32" y2="32" stroke="#FFFFFF" stroke-width="10"/>
    <line x1="62" y1="106" x2="50" y2="32" stroke="#FFFFFF" stroke-width="10"/>
  </g>
  <!-- the foot, the jib, the counterweight and the hook -->
  <rect x="10" y="106" width="64" height="12" rx="4" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <rect x="12" y="38" width="22" height="18" rx="3" fill="#BFBFBF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <rect x="14" y="14" width="102" height="14" rx="5" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <rect x="20" y="21" width="90" height="3" rx="1.5" fill="#BFBFBF"/>
  <path d="M102 28 V64 q0 12 -10 12 q-8 0 -8 -8" fill="none" stroke="#4D4D4D" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M102 28 V64 q0 12 -10 12 q-8 0 -8 -8" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
