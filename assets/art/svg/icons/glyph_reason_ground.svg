<!-- Placement reason glyph, GROUND (terrain that cannot be built on): white and grey only, tinted at run time. -->
<!-- Shape: two jagged mountain peaks side by side, a small one at the front left and a tall one behind it on the right, standing on one flat base line. It sits on a dark rounded plate with a white rim. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- seat: a dark plate with a white rim, so the glyph reads on grass, sand and the red ghost -->
  <rect x="6" y="6" width="116" height="116" rx="22" fill="#4D4D4D"/>
  <rect x="11" y="11" width="106" height="106" rx="17" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <g transform="translate(64 64) scale(0.8) translate(-64 -64)">
    <!-- tall peak behind -->
    <polygon points="48,108 86,22 122,108" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="86,22 122,108 86,108" fill="#BFBFBF"/>
    <polygon points="48,108 86,22 122,108" fill="none" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
    <line x1="86" y1="26" x2="86" y2="106" stroke="#4D4D4D" stroke-width="3"/>
    <!-- small peak in front -->
    <polygon points="6,108 34,50 62,108" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="34,50 62,108 34,108" fill="#BFBFBF"/>
    <polygon points="6,108 34,50 62,108" fill="none" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
    <line x1="34" y1="54" x2="34" y2="106" stroke="#4D4D4D" stroke-width="3"/>
  </g>
</svg>
