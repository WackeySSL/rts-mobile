<!-- Vehicles tab glyph: white and grey only, tinted at run time (the third build tab). -->
<!-- Shape: a tank seen from the side, a long track pod with four grey wheels, a sloped hull, a boxy turret and one long barrel to the right. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- barrel and turret -->
  <rect x="80" y="42" width="42" height="12" rx="3" fill="#BFBFBF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <rect x="34" y="30" width="56" height="34" rx="9" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <!-- hull -->
  <polygon points="16,88 26,62 102,62 114,88" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <!-- track pod with wheels -->
  <rect x="8" y="82" width="112" height="34" rx="17" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#BFBFBF" stroke="#4D4D4D" stroke-width="3">
    <circle cx="30" cy="99" r="9"/>
    <circle cx="54" cy="99" r="9"/>
    <circle cx="78" cy="99" r="9"/>
    <circle cx="102" cy="99" r="9"/>
  </g>
</svg>
