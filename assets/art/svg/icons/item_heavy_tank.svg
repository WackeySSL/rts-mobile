<!-- Heavy tank build icon: palette colours, one neutral grey team mark, drawn on a clear canvas for a tile of 64 dp or more. -->
<!-- Silhouette: a squat armoured slab, two broad flat-sided track pods with chamfered fronts joined by a deep deck, a wide eight-sided turret and one thick barrel with a fat bulge and a cross-bar muzzle brake. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- track pods -->
  <g fill="#5B6670" stroke="#1C2127" stroke-width="4" stroke-linejoin="round">
    <path d="M12 14 L88 14 L100 26 L100 42 L6 42 L6 20 Q6 14 12 14 Z"/>
    <path d="M12 114 L88 114 L100 102 L100 86 L6 86 L6 108 Q6 114 12 114 Z"/>
  </g>
  <g stroke="#A9B4BE" stroke-width="2.5" stroke-linecap="round">
    <line x1="14" y1="18" x2="86" y2="18"/>
    <line x1="14" y1="110" x2="86" y2="110"/>
  </g>
  <!-- deck and nose -->
  <polygon points="14,42 88,42 108,54 108,74 88,86 14,86" fill="#4E5A3A" stroke="#1C2127" stroke-width="4" stroke-linejoin="round"/>
  <!-- neutral team plates -->
  <g fill="#9AA5B1" stroke="#1C2127" stroke-width="2" stroke-linejoin="round">
    <rect x="14" y="22" width="76" height="14" rx="3"/>
    <rect x="14" y="92" width="76" height="14" rx="3"/>
    <polygon points="92,47 105,54 105,62 92,61"/>
    <polygon points="92,81 105,74 105,66 92,67"/>
  </g>
  <!-- barrel, bulge and muzzle brake -->
  <rect x="92" y="58" width="28" height="12" fill="#7D8893" stroke="#1C2127" stroke-width="4" stroke-linejoin="round"/>
  <rect x="100" y="53" width="11" height="22" rx="3" fill="#A9B4BE" stroke="#1C2127" stroke-width="4" stroke-linejoin="round"/>
  <rect x="112" y="52" width="10" height="24" rx="2" fill="#5B6670" stroke="#1C2127" stroke-width="4" stroke-linejoin="round"/>
  <!-- bustle and turret -->
  <rect x="18" y="52" width="14" height="24" rx="4" fill="#4E5A3A" stroke="#1C2127" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="28,52 38,40 74,40 88,50 88,78 74,88 38,88 28,76" fill="#6B7A4F" stroke="#1C2127" stroke-width="4" stroke-linejoin="round"/>
  <line x1="42" y1="47" x2="72" y2="47" stroke="#8C9A6B" stroke-width="3" stroke-linecap="round"/>
  <rect x="86" y="48" width="10" height="32" rx="3" fill="#5B6670" stroke="#1C2127" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="47" cy="55" r="6" fill="#7D8893" stroke="#1C2127" stroke-width="2"/>
</svg>
