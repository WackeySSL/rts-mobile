<!-- Offline glyph: white and grey only, tinted at run time (a defence that has no power). -->
<!-- Shape: a grey lightning bolt struck through by one thick white slash from the top left to the bottom right. It sits on a dark rounded plate with a white rim. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- seat: a dark plate with a white rim, so the glyph reads on grass, sand and the red ghost -->
  <rect x="6" y="6" width="116" height="116" rx="22" fill="#4D4D4D"/>
  <rect x="11" y="11" width="106" height="106" rx="17" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <g transform="translate(64 64) scale(0.8) translate(-64 -64)">
    <polygon points="76,10 32,68 58,68 48,118 98,52 72,52 90,10" fill="#BFBFBF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
    <!-- slash: edge grey under, white over -->
    <line x1="18" y1="18" x2="110" y2="110" stroke="#4D4D4D" stroke-width="24" stroke-linecap="round"/>
    <line x1="18" y1="18" x2="110" y2="110" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
