<!-- Draw emblem: white and grey only, tinted at run time (the result screen). -->
<!-- Shape: a round disc with two level bars across it, an equals sign, shaded along its lower right rim. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <circle cx="64" cy="64" r="54" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4"/>
  <!-- shade along the lower right rim -->
  <path d="M104 92 A46 46 0 0 1 36 104 A54 54 0 0 0 110 78 Z" fill="#BFBFBF"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#4D4D4D" stroke-width="4"/>
  <!-- the two level bars -->
  <rect x="30" y="42" width="68" height="14" rx="4" fill="#4D4D4D"/>
  <rect x="30" y="72" width="68" height="14" rx="4" fill="#4D4D4D"/>
</svg>
