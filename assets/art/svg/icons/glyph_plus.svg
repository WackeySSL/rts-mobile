<!-- Plus glyph: white and grey only, tinted at run time (the group column's save button, saves the selection as a group). -->
<!-- Shape: a bold plus of two crossing strokes, one level and one upright, round at every end. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <g fill="none" stroke-linecap="round">
    <line x1="22" y1="64" x2="106" y2="64" stroke="#4D4D4D" stroke-width="34"/>
    <line x1="64" y1="22" x2="64" y2="106" stroke="#4D4D4D" stroke-width="34"/>
    <line x1="22" y1="64" x2="106" y2="64" stroke="#FFFFFF" stroke-width="24"/>
    <line x1="64" y1="22" x2="64" y2="106" stroke="#FFFFFF" stroke-width="24"/>
  </g>
</svg>
