  <!-- tanks: cylinders with a lid disc each -->
  <path d="M12 34 V90 H60 V34 A24 24 0 0 0 12 34 Z" fill="#8D8F88" stroke="#1C2127" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="14" y="36" width="9" height="54" fill="#B3B4AC"/><rect x="50" y="36" width="9" height="54" fill="#6B6D68"/>
  <circle cx="36" cy="34" r="24" fill="#B3B4AC" stroke="#1C2127" stroke-width="3.5"/>
  <circle cx="36" cy="34" r="9" fill="#6B6D68" stroke="#1C2127" stroke-width="2.5"/>
  <path d="M68 40 V90 H96 V40 A14 14 0 0 0 68 40 Z" fill="#8D8F88" stroke="#1C2127" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="70" y="42" width="6" height="48" fill="#B3B4AC"/><rect x="88" y="42" width="6" height="48" fill="#6B6D68"/>
  <circle cx="82" cy="40" r="14" fill="#B3B4AC" stroke="#1C2127" stroke-width="3.5"/>
  <circle cx="82" cy="40" r="5" fill="#6B6D68" stroke="#1C2127" stroke-width="2"/>
  <path d="M97 56 V90 H119 V56 A11 11 0 0 0 97 56 Z" fill="#8D8F88" stroke="#1C2127" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="99" y="58" width="5" height="32" fill="#B3B4AC"/><rect x="112" y="58" width="5" height="32" fill="#6B6D68"/>
  <circle cx="108" cy="56" r="11" fill="#B3B4AC" stroke="#1C2127" stroke-width="3.5"/>
  <circle cx="108" cy="56" r="4" fill="#6B6D68" stroke="#1C2127" stroke-width="2"/>
  <rect x="58" y="62" width="12" height="6" fill="#5D6B68" stroke="#1C2127" stroke-width="2.5"/>
  <!-- hall -->
  <polygon points="6,84 122,84 122,100 6,100" fill="#A0ACA8" stroke="#1C2127" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="9" y="87" width="110" height="3" fill="#FFFFFF" opacity="0.55"/><rect x="9" y="94" width="110" height="3" fill="#5D6B68" opacity="0.5"/>
  <rect x="8" y="100" width="112" height="10" fill="#5D6B68" stroke="#1C2127" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="14" y="103" width="22" height="4" fill="#1C2127"/><rect x="92" y="103" width="22" height="4" fill="#1C2127"/>
  <!-- ore funnel -->
  <polygon points="46,98 82,98 76,118 52,118" fill="#8D8F88" stroke="#1C2127" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="52,101 76,101 72,113 56,113" fill="#F2B705"/>
  <polygon points="52,101 76,101 74,105 54,105" fill="#FFD84D"/>
  <polygon points="56,113 72,113 73,109 55,109" fill="#A67C00"/>
</svg>
