<!-- Refinery item icon: oblique 3/4 view, simplified, palette colours, no team colour, clear background. -->
<!-- Silhouette: one fat round tank and two small ones stepping off to the right rise behind a wide corrugated hall, with a gold-filled funnel jutting out of the middle of its front. -->
