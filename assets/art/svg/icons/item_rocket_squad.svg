<!-- Rocket squad build icon: palette colours, one neutral grey team mark, drawn on a clear canvas for a tile of 64 dp or more. -->
<!-- Silhouette: two staggered soldiers, each carrying a long fat launch tube flared at the back and ending in a rounded orange warhead, so the squad reads as two parallel bars. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <g stroke="#1C2127" stroke-width="4" stroke-linejoin="round">
    <!-- lower soldier: tube, flare, warhead, shoulders, helmet -->
    <rect x="30" y="72" width="70" height="22" rx="5" fill="#7D8893"/>
    <polygon points="100,72 120,83 100,94" fill="#F5A524"/>
    <polygon points="22,68 34,72 34,94 22,98" fill="#5B6670"/>
    <ellipse cx="46" cy="90" rx="13" ry="21" fill="#6B7A4F"/>
    <circle cx="47" cy="90" r="9" fill="#9AA5B1" stroke-width="3"/>
    <!-- upper soldier -->
    <rect x="16" y="20" width="70" height="22" rx="5" fill="#7D8893"/>
    <polygon points="86,20 106,31 86,42" fill="#F5A524"/>
    <polygon points="8,16 20,20 20,42 8,46" fill="#5B6670"/>
    <ellipse cx="32" cy="38" rx="13" ry="21" fill="#6B7A4F"/>
    <circle cx="33" cy="38" r="9" fill="#9AA5B1" stroke-width="3"/>
  </g>
  <!-- tube highlights -->
  <g stroke="#A9B4BE" stroke-width="2.5" stroke-linecap="round">
    <line x1="56" y1="77" x2="94" y2="77"/>
    <line x1="42" y1="25" x2="80" y2="25"/>
  </g>
</svg>
