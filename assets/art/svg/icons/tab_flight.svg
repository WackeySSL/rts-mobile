<!-- Flight tab glyph: white and grey only, tinted at run time (the airfield's build tab, shown while the faction has aircraft). -->
<!-- Shape: a jet seen from above, flying up: a slim rounded fuselage, two swept wings with grey undersides, a small tail plane. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- tail plane -->
  <polygon points="64,92 40,112 40,118 64,108 88,118 88,112" fill="#BFBFBF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <!-- wings -->
  <polygon points="64,44 10,86 10,96 64,80 118,96 118,86" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="64,66 14,92 14,96 64,80 114,96 114,92" fill="#BFBFBF"/>
  <!-- fuselage -->
  <path d="M64 10 C74 24 76 44 76 62 L76 104 C76 110 52 110 52 104 L52 62 C52 44 54 24 64 10 Z" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <!-- cockpit -->
  <ellipse cx="64" cy="38" rx="6" ry="12" fill="#BFBFBF"/>
</svg>
