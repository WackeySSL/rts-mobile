<!-- All army glyph: white and grey only, tinted at run time (the group column's All army button). -->
<!-- Shape: three soldiers shown from the chest up in a row, a tall one in front of two lower ones, each head under a grey half-dome helmet. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- the two soldiers behind -->
  <g fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round">
    <path d="M6,114 Q6,76 27,74 Q48,76 48,114 Z"/>
    <circle cx="27" cy="52" r="11"/>
  </g>
  <path d="M14,54 A13 13 0 0 1 40,54 Z" fill="#BFBFBF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round">
    <path d="M80,114 Q80,76 101,74 Q122,76 122,114 Z"/>
    <circle cx="101" cy="52" r="11"/>
  </g>
  <path d="M88,54 A13 13 0 0 1 114,54 Z" fill="#BFBFBF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <!-- the one in front -->
  <g fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round">
    <path d="M31,116 Q31,68 64,66 Q97,68 97,116 Z"/>
    <circle cx="64" cy="40" r="16"/>
  </g>
  <path d="M46,42 A18 18 0 0 1 82,42 Z" fill="#BFBFBF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
</svg>
