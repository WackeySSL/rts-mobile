<!-- Power plant build icon: palette colours, no team colour, drawn on a clear canvas for a tile of 64 dp or more. -->
<!-- Silhouette: one big and one small round drum with dark open mouths and a hub, side by side over a low wide ribbed hall. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- pipe between the drums -->
  <rect x="68" y="30" width="22" height="12" fill="#5B6670" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <!-- big drum -->
  <circle cx="44" cy="44" r="34" fill="#7D8893" stroke="#1C2127" stroke-width="4"/>
  <circle cx="44" cy="44" r="24" fill="#4E5A3A" stroke="#1C2127" stroke-width="3"/>
  <g stroke="#A9B4BE" stroke-width="6" stroke-linecap="round">
    <line x1="44" y1="28" x2="44" y2="60"/>
    <line x1="28" y1="44" x2="60" y2="44"/>
  </g>
  <circle cx="44" cy="44" r="6" fill="#A9B4BE" stroke="#1C2127" stroke-width="2"/>
  <!-- small drum -->
  <circle cx="100" cy="36" r="20" fill="#7D8893" stroke="#1C2127" stroke-width="4"/>
  <circle cx="100" cy="36" r="12" fill="#4E5A3A" stroke="#1C2127" stroke-width="3"/>
  <circle cx="100" cy="36" r="4" fill="#A9B4BE"/>
  <!-- ribbed hall -->
  <rect x="8" y="86" width="112" height="34" rx="6" fill="#5B6670" stroke="#1C2127" stroke-width="4" stroke-linejoin="round"/>
  <line x1="14" y1="91" x2="114" y2="91" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#1C2127" stroke-width="2.5" stroke-linecap="round">
    <line x1="30" y1="98" x2="30" y2="114"/>
    <line x1="50" y1="98" x2="50" y2="114"/>
    <line x1="70" y1="98" x2="70" y2="114"/>
    <line x1="90" y1="98" x2="90" y2="114"/>
  </g>
</svg>
