<!-- Menu glyph: white and grey only, tinted at run time (the menu button in the economy pill, opens the pause menu). -->
<!-- Shape: three level rounded bars of one length stacked with equal gaps, each bar white with a grey shaded foot. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <g fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round">
    <rect x="14" y="22" width="100" height="20" rx="10"/>
    <rect x="14" y="54" width="100" height="20" rx="10"/>
    <rect x="14" y="86" width="100" height="20" rx="10"/>
  </g>
  <g fill="#BFBFBF">
    <rect x="22" y="34" width="84" height="4" rx="2"/>
    <rect x="22" y="66" width="84" height="4" rx="2"/>
    <rect x="22" y="98" width="84" height="4" rx="2"/>
  </g>
</svg>
