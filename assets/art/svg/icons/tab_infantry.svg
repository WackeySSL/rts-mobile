<!-- Infantry tab glyph: white and grey only, tinted at run time (the second build tab). -->
<!-- Shape: a soldier from the chest up, a round helmet with a wide brim over a grey face, on a pair of sloping shoulders. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- shoulders -->
  <polygon points="10,118 18,94 42,82 86,82 110,94 118,118" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="64,86 86,86 110,96 114,114 64,114" fill="#BFBFBF"/>
  <polygon points="10,118 18,94 42,82 86,82 110,94 118,118" fill="none" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <!-- face, in shade under the brim -->
  <rect x="44" y="60" width="40" height="30" rx="10" fill="#BFBFBF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <!-- helmet dome and brim -->
  <path d="M24 62 Q24 12 64 12 Q104 12 104 62 Z" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <rect x="14" y="56" width="100" height="14" rx="6" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <path d="M64 12 Q104 12 104 56 H64 Z" fill="#BFBFBF"/>
  <path d="M24 62 Q24 12 64 12 Q104 12 104 62 Z" fill="none" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <rect x="14" y="56" width="100" height="14" rx="6" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
</svg>
