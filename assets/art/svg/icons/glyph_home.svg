<!-- Home glyph: white and grey only, tinted at run time (the Home order of the command bar: aircraft fly back to their airfield). -->
<!-- Shape: a house, a wide pitched roof over a boxy body with a dark doorway, a grey right flank for the lit and shaded planes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- body -->
  <rect x="26" y="58" width="76" height="52" rx="4" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <rect x="78" y="62" width="20" height="44" fill="#BFBFBF"/>
  <!-- roof -->
  <polygon points="64,12 118,60 10,60" fill="#FFFFFF" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="64,12 118,60 90,60" fill="#BFBFBF"/>
  <polygon points="64,12 118,60 10,60" fill="none" stroke="#4D4D4D" stroke-width="4" stroke-linejoin="round"/>
  <!-- doorway, dark -->
  <rect x="52" y="78" width="24" height="32" rx="3" fill="#4D4D4D"/>
</svg>
