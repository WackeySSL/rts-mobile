<!-- Infantry rally flag, hull layer: pole and foot, drawn first; the foot is the canvas centre, the point on the ground that the flag marks. -->
<!-- Shape: a slim metal pole standing up the page from a round foot plate, with a small round finial on top. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- ground shadow, offset (4,4), flattened as one group -->
  <g transform="translate(4 4)" opacity="0.25" fill="#000000">
    <circle cx="64" cy="64" r="12"/>
    <rect x="61" y="12" width="6" height="54" rx="3"/>
    <circle cx="64" cy="12" r="6"/>
  </g>
  <!-- foot plate -->
  <circle cx="64" cy="64" r="12" fill="#5B6670" stroke="#1C2127" stroke-width="3"/>
  <circle cx="64" cy="64" r="5" fill="#7D8893" stroke="#1C2127" stroke-width="1.5"/>
  <!-- pole -->
  <rect x="61" y="12" width="6" height="54" rx="3" fill="#A9B4BE" stroke="#1C2127" stroke-width="3" stroke-linejoin="round"/>
  <!-- finial -->
  <circle cx="64" cy="12" r="6" fill="#7D8893" stroke="#1C2127" stroke-width="3"/>
</svg>
