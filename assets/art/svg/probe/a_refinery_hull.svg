<!-- Style probe A, refinery, hull layer: top-down, weathered materials, soft cast shadows to the south-east; the small team marks are in the team layer. -->
<!-- Silhouette: a ragged tarmac apron carrying a long corrugated-roof hall across its back half, one fat grey tank and two small ones behind it, and a covered conveyor climbing from an ore hopper that opens at the middle of the south edge. -->
