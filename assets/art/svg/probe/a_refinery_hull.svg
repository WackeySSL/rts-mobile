    <linearGradient id="roofS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#74827f"/><stop offset="1" stop-color="#5d6b68"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#848d90"/><stop offset="1" stop-color="#454c50"/></linearGradient>
    <radialGradient id="ore" cx="0.5" cy="0.5" r="0.6" fx="0.35" fy="0.3"><stop offset="0" stop-color="#ecca55"/><stop offset="0.6" stop-color="#cf9f1d"/><stop offset="1" stop-color="#8a6410"/></radialGradient>
