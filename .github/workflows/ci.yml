name: CI

# Three jobs. "verify" is the only required check: format, lint, import, tests, sim smoke and the web
# export, all through the scripts a developer runs locally. "android-debug-apk" (ADR 0005) follows it,
# and on a push to main "android-dev-release" publishes that APK as the rolling pre-release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # An explicit shell makes GitHub run `bash --noprofile --norc -eo pipefail`, so a failing
    # command before `| tee` fails the step.
    shell: bash

env:
  GODOT_VERSION: "4.7.2"
  GDTOOLKIT_VERSION: "4.5.0"
  # PROBE ONLY (spike P26n, never merged): scripts/build-native.sh needs exactly this scons.
  SCONS_VERSION: "4.9.1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Godot editor and web export templates
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/opt/godot-${{ env.GODOT_VERSION }}
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64-web-${{ hashFiles('scripts/ci/install-godot.sh', 'scripts/ci/remote_zip.py') }}

      - name: Install Godot (editor + web no-threads templates only)
        run: bash scripts/ci/install-godot.sh

      - name: Install gdtoolkit
        run: pipx install "gdtoolkit==${GDTOOLKIT_VERSION}"

      # PROBE ONLY (spike P26n): the C++ port of the mock tick is built before anything imports or
      # tests the project. scripts/build-native.sh needs exactly scons 4.9.1 (pipx is pip in an isolated
      # environment: the runner's system Python is externally managed) and g++ (on the runner image).
      - name: Install scons
        run: |
          pipx install "scons==${SCONS_VERSION}"
          scons --version | sed -n '/SCons: /p'

      # The pins that key the cache, read from the script that owns them, so they cannot drift. The
      # scons object cache lives outside the workspace (SCONS_CACHE is read by godot-cpp's SConstruct),
      # which keeps the clean-tree check below meaningful.
      - name: Read the native toolchain pins
        id: native-pins
        run: |
          sha="$(sed -n 's/^GODOT_CPP_SHA="\([0-9a-f]\{40\}\)"$/\1/p' scripts/build-native.sh)"
          [ "${#sha}" = 40 ] || { echo "::error::no 40-digit GODOT_CPP_SHA=\"...\" line in scripts/build-native.sh"; exit 1; }
          gcc="$(g++ -dumpfullversion)"
          case "$gcc" in "" | *[!0-9.]*) echo "::error::unexpected g++ version '$gcc'"; exit 1 ;; esac
          { echo "godot_cpp_sha=$sha"; echo "gcc=$gcc"; } >> "$GITHUB_OUTPUT"
          echo "SCONS_CACHE=$HOME/.cache/rts-mobile-scons" >> "$GITHUB_ENV"

      # native/godot-cpp is the fetched, pinned godot-cpp checkout, SCONS_CACHE its compiled objects
      # (content-addressed: an entry is only used for the exact command line and sources that made it).
      # hashFiles runs before anything under native/ is fetched or built, so it sees tracked files only.
      # A source change misses the exact key and restores the newest cache of the same godot-cpp commit,
      # g++ and scons, which still holds the godot-cpp objects; only the port is compiled again.
      - name: Cache godot-cpp and the scons object cache
        id: native-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/godot-cpp
            ~/.cache/rts-mobile-scons
          key: native-linux-x86_64-gcc${{ steps.native-pins.outputs.gcc }}-godotcpp-${{ steps.native-pins.outputs.godot_cpp_sha }}-scons${{ env.SCONS_VERSION }}-${{ hashFiles('native/**', 'scripts/build-native.sh') }}
          restore-keys: |
            native-linux-x86_64-gcc${{ steps.native-pins.outputs.gcc }}-godotcpp-${{ steps.native-pins.outputs.godot_cpp_sha }}-scons${{ env.SCONS_VERSION }}-

      # Built here once, visibly, and again (an up-to-date no-op) by verify.sh, whose first step after
      # lint is the same build, before the import and the tests: if it fails there, verify.sh is RED.
      - name: Build the C++ tick (linux template_debug, what the editor loads)
        run: bash scripts/build-native.sh 2>&1 | tee "$RUNNER_TEMP/native-build.log"

      - name: Verify (format, lint, import, tests, sim smoke, error scan)
        run: bash scripts/verify.sh 2>&1 | tee "$RUNNER_TEMP/verify.log"

      # The tests that compare the C++ tick with the GDScript one FAIL without the library (they never
      # skip). This step proves from gdUnit4's results.xml that those suites ran and passed here: every
      # required case present, none failed, errored or skipped.
      - name: Check that the C++ bit-identity tests ran and passed
        run: bash scripts/ci/check-native-tests.sh

      # export-web.sh owns the export checks: Godot version, templates, error scan of its own log,
      # non-empty artifacts, wasm size, threads off and the dev_menu custom feature.
      - name: Export web build
        run: bash scripts/export-web.sh

      # verify.sh's dirty marker uses `git diff --quiet`, which misses untracked files such as a
      # forgotten .gd.uid or .import file. build/ and reports/ are git-ignored.
      - name: Clean-tree check (import, tests and export must not change the tree)
        if: success()
        run: |
          out="$(git status --porcelain)"; [ -z "$out" ] || { echo "::error::import/test/export changed the tree"; echo "$out"; exit 1; }

      - name: Job summary
        if: always()
        env:
          CACHE_HIT: ${{ steps.godot-cache.outputs.cache-hit }}
          NATIVE_CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
        run: |
          retrieved="$(grep -c '^Retrieved ' "$RUNNER_TEMP/native-build.log" 2>/dev/null || true)"
          {
            echo "Godot cache hit: ${CACHE_HIT:-false}"
            echo "Native (godot-cpp + scons objects) cache hit: ${NATIVE_CACHE_HIT:-false}, scons objects retrieved from it: ${retrieved:-0}"
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/verify.log" ] && grep -q '===== VERIFY SUMMARY =====' "$RUNNER_TEMP/verify.log"; then
              sed -n '/===== VERIFY SUMMARY =====/,$p' "$RUNNER_TEMP/verify.log"
            else
              echo "no VERIFY SUMMARY block (verify.sh did not finish)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  # ADR 0005: a debug APK for real-device testing. Not a required check; `verify` stays the only one.
  android-debug-apk:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      key_kind: ${{ steps.export-apk.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # android-dev-release only runs on main, so its script is tested here on every run: offline,
      # against a stub gh. A failure stops that job too, because it needs this one.
      - name: Offline test of publish-dev-release.sh
        run: bash scripts/ci/test-publish-dev-release.sh

      # PROBE ONLY (spike P26n): same for the NDK installer used below, against a stub sdkmanager.
      - name: Offline test of install-ndk.sh
        run: bash scripts/ci/test-install-ndk.sh

      # PROBE ONLY (spike P26n): and for the godot-cpp pins that export-android.sh names in the shipped
      # licence notice: read from build-native.sh, no second copy, exit 4 when they cannot be read.
      - name: Offline test of the godot-cpp pins in export-android.sh
        run: bash scripts/ci/test-export-android-pins.sh

      # Godot copies JAVA_HOME and ANDROID_HOME into its editor settings on its first run, so set
      # them before any Godot call (ANDROID_HOME is the runner image's SDK already).
      - name: Select JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Cache Godot editor and export templates (web and Android debug)
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/opt/godot-${{ env.GODOT_VERSION }}
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64-android-${{ hashFiles('scripts/ci/install-godot.sh', 'scripts/ci/remote_zip.py') }}

      - name: Install Godot (editor, web and Android debug templates)
        run: bash scripts/ci/install-godot.sh --android

      # PROBE ONLY (spike P26n): the APK carries the C++ port of the mock tick, built here for android
      # arm64 with the NDK that godot-cpp's pinned commit expects (28.1.13356709). The runner image
      # ships NDK 27.3, 29 and 30 only, so install-ndk.sh installs that one with sdkmanager (pinned,
      # into its own SDK root, with the licences the image already accepted) and sets
      # ANDROID_NDK_ROOT for the steps below. JAVA_HOME (JDK 17, above) is what sdkmanager runs on.
      # Only the release library is built for Android: the export below is --export-release (proved
      # in export-android.sh), which packs the android.release.arm64 entry of the .gdextension. The
      # editor that runs the export loads the linux debug library, so that one is built as well (else
      # every Godot call logs "Can't open dynamic library"). export-android.sh then fails unless the
      # APK holds lib/arm64-v8a/libprobe_tick.android.template_release.arm64.so with the bytes built here.
      - name: Install scons
        run: |
          pipx install "scons==${SCONS_VERSION}"
          scons --version | sed -n '/SCons: /p'

      - name: Install the pinned Android NDK
        run: bash scripts/ci/install-ndk.sh

      - name: Build the C++ tick (linux debug for the editor, android release arm64 for the APK)
        run: |
          bash scripts/build-native.sh
          bash scripts/build-native.sh --platform android --target template_release --arch arm64

      # Each exit code of export-android.sh that a runner or secret change could hit must stay
      # distinct: 3 wrong Godot, 4 template or toolchain missing, 5 no keystore.
      - name: Negative checks of export-android.sh (exit codes 3, 4, 5)
        run: |
          expect() { want="$1"; shift; rc=0; out="$("$@" 2>&1)" || rc=$?; [ "$rc" = "$want" ] || { echo "$out"; echo "::error::expected exit $want, got $rc: $*"; exit 1; }; echo "ok: exit $rc: ${out%%$'\n'*}"; }
          expect 3 env GODOT=/bin/true bash scripts/export-android.sh
          expect 4 env XDG_DATA_HOME="$RUNNER_TEMP/no-templates" bash scripts/export-android.sh
          expect 5 bash scripts/export-android.sh

      # A key is generated per run. Only a push to main may use the optional stable key, so PR code
      # never sees the secrets (ADR 0005 section 4). The password reaches the script by env only.
      - name: Export debug APK
        id: export-apk
        env:
          STABLE_KEYSTORE_B64: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.ANDROID_DEBUG_KEYSTORE_BASE64 || '' }}
          STABLE_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD || '' }}
        run: |
          umask 077
          keystore="$RUNNER_TEMP/debug.keystore"
          if [ -n "$STABLE_KEYSTORE_B64" ] && [ -n "$STABLE_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$STABLE_KEYSTORE_B64" | base64 -d > "$keystore"
            password="$STABLE_KEYSTORE_PASSWORD"
            kind=stable
          else
            keytool -genkeypair -keystore "$keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android -dname "CN=rts-mobile dev"
            password=android
            kind=generated
          fi
          echo "DEBUG_KEY_KIND=$kind" >> "$GITHUB_ENV"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$keystore" \
          GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey" \
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="$password" \
          bash scripts/export-android.sh

      # Same check as in verify: the import and the export must not change the tree.
      - name: Clean-tree check
        if: success()
        run: |
          out="$(git status --porcelain)"; [ -z "$out" ] || { echo "::error::import/export changed the tree"; echo "$out"; exit 1; }

      - name: Job summary
        if: always()
        env:
          CACHE_HIT: ${{ steps.godot-cache.outputs.cache-hit }}
        run: |
          apk=build/android/rts-mobile-debug.apk
          lib=lib/arm64-v8a/libprobe_tick.android.template_release.arm64.so
          {
            echo "Godot cache hit: ${CACHE_HIT:-false}"
            echo "- Android NDK for the C++ tick: $(basename "${ANDROID_NDK_ROOT:-unknown}")"
            if [ -s "$apk" ]; then
              echo "- C++ tick in the APK: \`$lib\`, $(unzip -p "$apk" "$lib" 2>/dev/null | wc -c | tr -d ' ' || true) bytes"
              echo "- APK: $(stat -c %s "$apk") bytes, SHA-256 \`$(sha256sum "$apk" | cut -d' ' -f1)\`, package dk.appcode.rts.dev"
              echo "- Signing key: ${DEBUG_KEY_KIND:-unknown}."
              [ "${DEBUG_KEY_KIND:-}" = stable ] || echo "- A generated key changes every run: uninstall the old APK first."
              echo "- Install: unzip the artifact on the phone and open rts-mobile-debug.apk."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete debug keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/debug.keystore"

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rts-mobile-debug-apk-${{ github.sha }}
          path: |
            build/android/rts-mobile-debug.apk
            build/android/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
          retention-days: 14

  # ADR 0005 section 6: the rolling pre-release android-dev-latest gives one stable phone URL. Only a
  # push to main reaches it (never a pull request, a fork or a manual run), after android-debug-apk
  # succeeded, and only this job holds contents: write. It publishes the APK that android-debug-apk
  # built in this same run and never rebuilds it. The workflow-level group above already queues the
  # push runs of main one after the other. The job-level group keeps two publishes from
  # interleaving (delete + create) even if that ever changes.
  android-dev-release:
    needs: android-debug-apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: android-dev-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Download the debug APK of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rts-mobile-debug-apk-${{ github.sha }}
          path: ${{ runner.temp }}/apk

      # Deletes and recreates the pre-release, then downloads the stable URL and compares SHA-256.
      - name: Replace the android-dev-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_KIND: ${{ needs.android-debug-apk.outputs.key_kind }}
        run: bash scripts/ci/publish-dev-release.sh "$RUNNER_TEMP/apk"
