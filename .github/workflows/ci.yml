name: CI

# Four jobs. "verify" is the only required check: format, lint, import, tests, sim smoke and the web
# export, all through the scripts a developer runs locally. "android-debug-apk" (ADR 0005) follows it,
# and on a push to main "android-dev-release" publishes that APK as the rolling pre-release.
# "native-clang" runs the native suites on a clang library (ADR 0013 section 10).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # An explicit shell makes GitHub run `bash --noprofile --norc -eo pipefail`, so a failing
    # command before `| tee` fails the step.
    shell: bash

env:
  GODOT_VERSION: "4.7.2"
  GDTOOLKIT_VERSION: "4.5.0"
  SCONS_VERSION: "4.9.1"
  CLANG_FORMAT_VERSION: "20.1.8"
  # godot-cpp's SConstruct caches objects here, outside the workspace (the tree stays clean).
  SCONS_CACHE: /home/runner/.cache/rts-mobile-scons

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Godot editor and web export templates
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/opt/godot-${{ env.GODOT_VERSION }}
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64-web-${{ hashFiles('scripts/ci/install-godot.sh', 'scripts/ci/remote_zip.py') }}

      - name: Install Godot (editor + web no-threads templates only)
        run: bash scripts/ci/install-godot.sh

      - name: Install gdtoolkit
        run: pipx install "gdtoolkit==${GDTOOLKIT_VERSION}"

      # Offline, against stub tools: the seed, the library check, build-native.sh's exit codes and ELF
      # checks and the C++ format check (ADR 0013 sections 8-10).
      - name: Offline test of the native scripts
        run: bash scripts/ci/test-native-scripts.sh

      # verify.sh builds the C++ kernels first and checks their format last (ADR 0013 section 10).
      - name: Install the native toolchain (SCons, clang-format, binutils)
        run: |
          pipx install "scons==${SCONS_VERSION}"
          pipx install "clang-format==${CLANG_FORMAT_VERSION}"
          sudo apt-get install -y --no-install-recommends binutils

      # The native caches (ADR 0013 section 8). build-native.sh owns the pins and prints the key. The key
      # is assigned first, so a failing build-native.sh fails this step with its own message (inside
      # echo's argument it would write an empty key and fail one step later, in actions/cache).
      - name: Read the native cache key
        id: native-key
        run: |
          key="$(bash scripts/build-native.sh --print-cache-key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache godot-cpp and the SCons object cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/godot-cpp
            ${{ env.SCONS_CACHE }}
          key: ${{ steps.native-key.outputs.key }}

      # On this fresh checkout verify.sh builds, seeds and imports with no retry: the fresh-clone
      # import canary (ADR 0013 section 9).
      - name: Verify (native build, format, lint, import, tests, C++ format, sim smoke, error scan)
        run: bash scripts/verify.sh 2>&1 | tee "$RUNNER_TEMP/verify.log"

      # ADR 0013 section 10: the native suites verify.sh ran must have passed. Never inside verify.sh.
      - name: Check the native suites ran (check-native-tests.sh)
        run: bash scripts/ci/check-native-tests.sh

      # export-web.sh owns the export checks: Godot version, templates, error scan of its own log,
      # non-empty artifacts, wasm size, threads off and the dev_menu custom feature.
      - name: Export web build
        run: bash scripts/export-web.sh

      # verify.sh's dirty marker uses `git diff --quiet`, which misses untracked files such as a
      # forgotten .gd.uid or .import file. build/ and reports/ are git-ignored.
      - name: Clean-tree check (import, tests and export must not change the tree)
        if: success()
        run: |
          out="$(git status --porcelain)"; [ -z "$out" ] || { echo "::error::import/test/export changed the tree"; echo "$out"; exit 1; }

      - name: Job summary
        if: always()
        env:
          CACHE_HIT: ${{ steps.godot-cache.outputs.cache-hit }}
        run: |
          {
            echo "Godot cache hit: ${CACHE_HIT:-false}"
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/verify.log" ] && grep -q '===== VERIFY SUMMARY =====' "$RUNNER_TEMP/verify.log"; then
              sed -n '/===== VERIFY SUMMARY =====/,$p' "$RUNNER_TEMP/verify.log"
            else
              echo "no VERIFY SUMMARY block (verify.sh did not finish)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  # ADR 0013 section 10: a clang -O3 library (the shipped build is NDK clang -O3, the other runs g++ -O2)
  # running the tests/sim/native suites. Not required. gdUnit4 runs only when a suite exists
  # (run-tests.sh exits 1 when no test ran): before P54 only the check runs. P51 adds the golden hashes.
  native-clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Godot editor and web export templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/opt/godot-${{ env.GODOT_VERSION }}
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64-web-${{ hashFiles('scripts/ci/install-godot.sh', 'scripts/ci/remote_zip.py') }}

      - name: Install Godot (editor + web no-threads templates only)
        run: bash scripts/ci/install-godot.sh

      - name: Install the native toolchain (SCons, clang, binutils)
        run: |
          pipx install "scons==${SCONS_VERSION}"
          sudo apt-get install -y --no-install-recommends binutils clang

      - name: Read the native cache key
        id: native-key
        run: |
          key="$(bash scripts/build-native.sh --compiler clang --optimize speed --print-cache-key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache godot-cpp and the SCons object cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/godot-cpp
            ${{ env.SCONS_CACHE }}
          key: ${{ steps.native-key.outputs.key }}

      - name: Build the library (clang, optimize=speed)
        run: bash scripts/build-native.sh --compiler clang --optimize speed

      # Everything under tests/sim/native runs, sanitizer/ included, while the check prunes it: P57 decides
      # how its dump step stays out of the gdUnit4 runs (here and in verify.sh), once that step exists.
      # P51 adds the golden hashes to this one call (-a res://tests/perf/test_golden_hashes.gd): the check
      # reads one results.xml, and run-tests.sh deletes the report of an earlier call.
      - name: Run the native suites (gdUnit4), when discovery finds one
        run: |
          if [ -n "$(bash scripts/ci/check-native-tests.sh --list)" ]; then bash scripts/run-tests.sh -a res://tests/sim/native; fi

      - name: Check the native suites ran (check-native-tests.sh)
        run: bash scripts/ci/check-native-tests.sh

  # ADR 0005: a debug APK for real-device testing. Not a required check; `verify` stays the only one.
  android-debug-apk:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      key_kind: ${{ steps.export-apk.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # android-dev-release only runs on main, so its script is tested here on every run: offline,
      # against a stub gh. A failure stops that job too, because it needs this one.
      - name: Offline test of publish-dev-release.sh
        run: bash scripts/ci/test-publish-dev-release.sh

      # Both export scripts write a THIRD_PARTY_LICENSES.txt. This runs the real scripts against stub
      # tools, offline, and checks that each appends the LLVM libc++ licence with the same text
      # (ADR 0005 section 5), before the job spends time on a real export.
      - name: Offline test of the export licence notices
        run: bash scripts/ci/test-export-notices.sh

      # Godot copies JAVA_HOME and ANDROID_HOME into its editor settings on its first run, so set
      # them before any Godot call (ANDROID_HOME is the runner image's SDK already).
      - name: Select JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Cache Godot editor and export templates (web and Android debug)
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/opt/godot-${{ env.GODOT_VERSION }}
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64-android-${{ hashFiles('scripts/ci/install-godot.sh', 'scripts/ci/remote_zip.py') }}

      - name: Install Godot (editor, web and Android debug templates)
        run: bash scripts/ci/install-godot.sh --android

      # Each exit code of export-android.sh that a runner or secret change could hit must stay
      # distinct: 3 wrong Godot, 4 template or toolchain missing, 5 no keystore.
      - name: Negative checks of export-android.sh (exit codes 3, 4, 5)
        run: |
          expect() { want="$1"; shift; rc=0; out="$("$@" 2>&1)" || rc=$?; [ "$rc" = "$want" ] || { echo "$out"; echo "::error::expected exit $want, got $rc: $*"; exit 1; }; echo "ok: exit $rc: ${out%%$'\n'*}"; }
          expect 3 env GODOT=/bin/true bash scripts/export-android.sh
          expect 4 env XDG_DATA_HOME="$RUNNER_TEMP/no-templates" bash scripts/export-android.sh
          expect 5 bash scripts/export-android.sh

      # A key is generated per run. Only a push to main may use the optional stable key, so PR code
      # never sees the secrets (ADR 0005 section 4). The password reaches the script by env only.
      - name: Export debug APK
        id: export-apk
        env:
          STABLE_KEYSTORE_B64: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.ANDROID_DEBUG_KEYSTORE_BASE64 || '' }}
          STABLE_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD || '' }}
        run: |
          umask 077
          keystore="$RUNNER_TEMP/debug.keystore"
          if [ -n "$STABLE_KEYSTORE_B64" ] && [ -n "$STABLE_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$STABLE_KEYSTORE_B64" | base64 -d > "$keystore"
            password="$STABLE_KEYSTORE_PASSWORD"
            kind=stable
          else
            keytool -genkeypair -keystore "$keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android -dname "CN=rts-mobile dev"
            password=android
            kind=generated
          fi
          echo "DEBUG_KEY_KIND=$kind" >> "$GITHUB_ENV"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$keystore" \
          GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey" \
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="$password" \
          bash scripts/export-android.sh

      # Same check as in verify: the import and the export must not change the tree.
      - name: Clean-tree check
        if: success()
        run: |
          out="$(git status --porcelain)"; [ -z "$out" ] || { echo "::error::import/export changed the tree"; echo "$out"; exit 1; }

      - name: Job summary
        if: always()
        env:
          CACHE_HIT: ${{ steps.godot-cache.outputs.cache-hit }}
        run: |
          apk=build/android/rts-mobile-debug.apk
          {
            echo "Godot cache hit: ${CACHE_HIT:-false}"
            if [ -s "$apk" ]; then
              echo "- APK: $(stat -c %s "$apk") bytes, SHA-256 \`$(sha256sum "$apk" | cut -d' ' -f1)\`, package dk.appcode.rts.dev"
              echo "- Signing key: ${DEBUG_KEY_KIND:-unknown}."
              [ "${DEBUG_KEY_KIND:-}" = stable ] || echo "- A generated key changes every run: uninstall the old APK first."
              echo "- Install: unzip the artifact on the phone and open rts-mobile-debug.apk."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete debug keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/debug.keystore"

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rts-mobile-debug-apk-${{ github.sha }}
          path: |
            build/android/rts-mobile-debug.apk
            build/android/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
          retention-days: 14

  # ADR 0005 section 6: the rolling pre-release android-dev-latest gives one stable phone URL. Only a
  # push to main reaches it (never a pull request, a fork or a manual run), after android-debug-apk
  # succeeded, and only this job holds contents: write. It publishes the APK that android-debug-apk
  # built in this same run and never rebuilds it. The workflow-level group above already queues the
  # push runs of main one after the other. The job-level group keeps two publishes from
  # interleaving (delete + create) even if that ever changes.
  android-dev-release:
    needs: android-debug-apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: android-dev-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Download the debug APK of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rts-mobile-debug-apk-${{ github.sha }}
          path: ${{ runner.temp }}/apk

      # Deletes and recreates the pre-release, then downloads the stable URL and compares SHA-256.
      - name: Replace the android-dev-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_KIND: ${{ needs.android-debug-apk.outputs.key_kind }}
        run: bash scripts/ci/publish-dev-release.sh "$RUNNER_TEMP/apk"
