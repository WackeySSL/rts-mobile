name: Balance run

# The balance run (P190, ADR 0031 section 5): headless AI-vs-AI matches on the native kernels, in shards, summarised per set
# and posted as one comment on the open issue labelled `balance`. A development tool that runs on GitHub's machines: players
# never see it. Never a required check, never on a pull request, no schedule. It starts after a merge that changes the AI, the
# sim, the data or the native code, and by hand (`workflow_dispatch`: suite balance, gate or custom). The gate run (suite=gate)
# plays the held-out seeds 1001-1100 on `main` (section 6); a custom run (the tuning PR's "after") keeps its artifact only.
# A run plays the commit it is dispatched on ("Use workflow from"); there is no ref input, so github.sha is the commit played.
# scripts/ci/balance-plan.sh owns the shard table and
# tests/project/test_ci_balance_workflow.gd pins it and this file's rules. The label and the issue "Balance reports" are made
# once by the lead: `post` never creates them and fails clearly when they are missing.
# The gate's rerun (ADR 0031 section 6, seeds 1101-1200) is merged by hand, not here: run `custom` on the gate's commit (dispatch from `main` if it has not moved, else from a branch pushed at the gate's SHA) for the
# gate set's levels (normal,normal), scenarios cross and seeds 1101-1200, download the artifacts of both runs, then run
# `bash scripts/balance-summary.sh --gate --out gate-200.json <the gate run's gate.json> <the rerun's custom.json>`.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "game/ai/**"
      - "game/sim/**"
      - "native/**"
  workflow_dispatch:
    inputs:
      suite:
        description: "balance: the five sets; gate: the held-out seeds 1001-1100; custom: one set below (artifact only); gate runs on main only"
        type: choice
        options: [balance, gate, custom]
        default: balance
      levels:
        description: "custom: the two controllers, like normal,hard (easy, normal, hard, dummy)"
        type: string
        default: normal,normal
      scenarios:
        description: "custom: cross, derrick, lumen, fossil-mirror or renew-mirror"
        type: string
        default: cross
      matches:
        description: "custom: the number of matches, 1 to 200"
        type: string
        default: "20"
      seed_start:
        description: "custom: the first seed (a range that reaches 1000-1100 is refused: 1000 bounds the balance sets, the gate plays 1001-1100)"
        type: string
        default: "1"

# Nothing at the top; each job names its own.
permissions: {}

# A push and a manual balance run share a group, so a burst of merges ends in one run on the newest commit. A gate or custom
# run has its own group: a merge never cancels it. The group is keyed on the branch the run is dispatched from ("of `main`"
# for a push), so two `custom` runs from one branch cancel each other: run the two custom runs of the gate procedure
# one after the other.
concurrency:
  group: balance-${{ github.ref }}-${{ inputs.suite || 'balance' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.7.2"
  SCONS_VERSION: "4.9.1"
  # godot-cpp's SConstruct caches objects here, outside the workspace.
  SCONS_CACHE: /home/runner/.cache/rts-mobile-scons

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
      sets: ${{ steps.plan.outputs.sets }}
    steps:
      # First, before any checkout, so it runs no repository code: the held-out seeds are played on main only.
      - name: Refuse a gate run off main
        env:
          SUITE: ${{ inputs.suite || 'balance' }}
          REF: ${{ github.ref }}
        run: |
          if [ "$SUITE" = "gate" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::A gate run plays main only (ADR 0031 section 6); dispatch it with Use workflow from: main."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The shard table and the check of a custom run's inputs, before anything is built. A bad input fails here.
      - name: Plan the shards
        id: plan
        env:
          SUITE: ${{ inputs.suite || 'balance' }}
          LEVELS: ${{ inputs.levels }}
          SCENARIOS: ${{ inputs.scenarios }}
          MATCHES: ${{ inputs.matches }}
          SEED_START: ${{ inputs.seed_start }}
        run: |
          matrix="$(bash scripts/ci/balance-plan.sh matrix)"
          sets="$(bash scripts/ci/balance-plan.sh sets)"
          sha="$(git rev-parse HEAD)"
          { echo "sha=$sha"; echo "matrix=$matrix"; echo "sets=$sets"; } >> "$GITHUB_OUTPUT"

      - name: Install the native toolchain (SCons, binutils)
        run: |
          pipx install "scons==${SCONS_VERSION}"
          sudo apt-get install -y --no-install-recommends binutils

      - name: Read the native cache key
        id: native-key
        run: |
          key="$(bash scripts/build-native.sh --print-cache-key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # Restore only: ci.yml's verify job saves this key on every push to main.
      - name: Restore godot-cpp and the SCons object cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/godot-cpp
            ${{ env.SCONS_CACHE }}
          key: ${{ steps.native-key.outputs.key }}

      - name: Build the library (build-native.sh)
        run: bash scripts/build-native.sh

      # Built once; every shard downloads it. The artifact root is native/ (bin/ and the generated .gdextension).
      - name: Upload the native library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: balance-native
          path: |
            native/bin/
            native/sim_kernels.gdextension
          if-no-files-found: error
          retention-days: 7

  shards:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - name: Restore the Godot editor and web export templates
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/opt/godot-${{ env.GODOT_VERSION }}
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64-web-${{ hashFiles('scripts/ci/install-godot.sh', 'scripts/ci/remote_zip.py') }}

      - name: Install Godot (editor + web no-threads templates only)
        run: bash scripts/ci/install-godot.sh

      - name: Download the native library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: balance-native
          path: native

      # The report stores GITHUB_SHA as its commit. The runner resets GITHUB_* in a step's env, so it is set in the shell.
      - name: Play the shard (run-sim-smoke.sh)
        env:
          BUILD_SHA: ${{ needs.build.outputs.sha }}
          SHARD: ${{ matrix.name }}
          MATCHES: ${{ matrix.matches }}
          SEED_START: ${{ matrix.seed_start }}
          LEVELS: ${{ matrix.levels }}
          SCENARIOS: ${{ matrix.scenarios }}
        run: |
          GITHUB_SHA="$BUILD_SHA" bash scripts/run-sim-smoke.sh --matches "$MATCHES" --seed-start "$SEED_START" --levels "$LEVELS" --scenarios "$SCENARIOS" --report "build/balance/$SHARD.json"

      # The balance run measures the native kernels (ADR 0031 section 1): a shard that fell back to GDScript fails. The
      # report must also name the commit that was built.
      - name: Check the shard ran native on the built commit
        env:
          SHARD: ${{ matrix.name }}
          BUILD_SHA: ${{ needs.build.outputs.sha }}
        run: python3 -I -c 'import json, sys; r = json.load(open(sys.argv[1])); sys.exit(0 if r["impl"] == "native" and r["commit"] == sys.argv[2] else "the shard did not run native on the built commit")' "build/balance/$SHARD.json" "$BUILD_SHA"

      - name: Upload the shard report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-${{ matrix.name }}
          path: build/balance/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 7

  summarise:
    needs: [build, shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.name.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - name: Restore the Godot editor and web export templates
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/opt/godot-${{ env.GODOT_VERSION }}
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64-web-${{ hashFiles('scripts/ci/install-godot.sh', 'scripts/ci/remote_zip.py') }}

      - name: Install Godot (editor + web no-threads templates only)
        run: bash scripts/ci/install-godot.sh

      - name: Download the shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-*
          merge-multiple: true
          path: build/balance/shards

      # One summary per set (its shards merge; the two mirrors are two sets). Only the gate run passes --gate.
      - name: Summarise each set (balance-summary.sh)
        env:
          SETS: ${{ needs.build.outputs.sets }}
        run: |
          for set in $SETS; do
            flags=()
            if [ "$set" = "gate" ]; then flags=(--gate); fi
            bash scripts/balance-summary.sh --out "build/balance/summary/$set.json" "${flags[@]}" build/balance/shards/"$set"-*.json
            cat "build/balance/summary/$set.md" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Name the artifact
        id: name
        env:
          SHA: ${{ needs.build.outputs.sha }}
        run: echo "name=balance-$(date -u +%F)-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Upload the summaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: build/balance/summary/
          if-no-files-found: error
          retention-days: 90

  # No checkout and no repository code: it reads the markdown the summarise job made and talks to the issue. Only a push
  # run and a balance or gate run of `main` post; a custom run, or a run of another branch, keeps the artifact only. Event data
  # reaches the scripts only through env.
  post:
    needs: [build, summarise]
    if: github.ref == 'refs/heads/main' && !github.event.repository.fork && (github.event_name == 'push' || inputs.suite != 'custom')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # issues: write is for the one comment on the balance issue; nothing else is granted.
    permissions:
      issues: write
    steps:
      - name: Download the summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.summarise.outputs.artifact }}
          path: summary

      - name: Comment on the balance issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.build.outputs.sha }}
          SUITE: ${{ inputs.suite || 'balance' }}
          SETS: ${{ needs.build.outputs.sets }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number="$(gh issue list --label balance --state open --limit 20 --json number,title --jq '[.[] | select(.title == "Balance reports")][0].number // empty')"
          if [ -z "$number" ]; then
            echo "::error::No open issue titled \"Balance reports\" with the label balance. The lead creates the label and the issue once; this job never does. The summaries stay in the artifact of this run."
            exit 1
          fi
          {
            echo "### Balance run on \`main\` at \`$SHA\`"
            echo
            echo "Suite: $SUITE. Run: $RUN_URL"
            for set in $SETS; do
              echo
              echo "<details open><summary>$set</summary>"
              echo
              cat "summary/$set.md"
              echo
              echo "</details>"
            done
          } > body.md
          if [ "$(wc -c < body.md)" -gt 60000 ]; then
            head -c 58000 body.md > cut.md
            printf '\n\n(Cut at 58000 bytes, under GitHub's 65536 character comment limit; the whole report is in the artifact of %s.)\n' "$RUN_URL" >> cut.md
            mv cut.md body.md
          fi
          gh issue comment "$number" --body-file body.md
